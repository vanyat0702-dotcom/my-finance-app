
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071810">
<title>ORACLE LIFE 7.5</title>
<style>
:root{
 --bg:#061610;
 --card:#102b20;
 --card2:#193b2c;
 --gold:#e8c77e;
 --green:#2ddd9e;
 --text:#edf5ee;
 --muted:#abc4b4;
 --line:#355b47;
 --red:#ff9da4;
 --blue:#99c9ff
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font:14px system-ui,-apple-system,Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5}
header{
 padding:22px 16px;
 background:linear-gradient(125deg,#164331,#071810);
 border-bottom:1px solid var(--line)
}
.brand{
 color:var(--gold);font:700 29px Georgia,serif;
 letter-spacing:1px
}
.brand span{color:var(--green)}
.motto{
 color:var(--gold);font-size:10px;
 letter-spacing:1px;margin-top:9px
}
.sub{color:var(--muted);font-size:12px;margin-top:9px}
main{max-width:800px;margin:auto;padding:15px 13px 110px}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:17px;padding:16px;margin-bottom:14px
}
h2{font-size:19px;color:var(--gold);margin:0 0 14px}
h3{font-size:15px;color:var(--gold);margin:15px 0 10px}
p{line-height:1.55}
.muted{color:var(--muted);font-size:12px}
.gold{color:var(--gold)}
.green{color:var(--green)}
.red{color:var(--red)}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px
}
.tile{
 background:var(--card2);border-radius:11px;
 padding:12px;min-width:0
}
.value{
 font-size:19px;font-weight:800;color:var(--gold);
 overflow-wrap:anywhere;margin-top:6px
}
label{display:block;color:var(--gold);margin:12px 0 5px}
input,select,textarea{
 display:block;width:100%;background:#071e16;
 border:1px solid #52705d;border-radius:9px;
 color:white;padding:11px;outline:none
}
textarea{min-height:85px;resize:vertical}
.btn{
 border:0;border-radius:10px;padding:11px 12px;
 background:var(--green);color:#06231a;font-weight:800
}
.btn.alt{background:#28533e;color:white}
.btn.danger{background:#773b42;color:white}
.btn.goldbtn{background:var(--gold);color:#201b0d}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.buttons .btn{flex:1;min-width:90px}
.row{
 display:flex;justify-content:space-between;
 align-items:center;gap:9px;
 padding:11px 0;border-bottom:1px solid var(--line)
}
.row>span{min-width:0;overflow-wrap:anywhere}
.row b{color:var(--gold)}
.row small{display:block;color:var(--muted);margin-top:4px}
.nav{
 position:fixed;bottom:0;left:0;right:0;z-index:20;
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
 background:#08241a;border-top:1px solid var(--line);
 padding:6px 3px calc(6px + env(safe-area-inset-bottom))
}
.nav button{
 background:transparent;border:0;color:#c6d8cb;
 border-radius:9px;padding:8px 1px;font-size:11px
}
.nav button.active{background:#21523c;color:var(--gold)}
.nav b{display:block;font-size:20px;margin-bottom:3px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px}
.tabs button{
 white-space:nowrap;background:#1b3c2e;
 color:white;border:1px solid var(--line);
 border-radius:9px;padding:10px
}
.tabs button.active{border-color:var(--gold);color:var(--gold)}
.notice,.success,.info{
 border-radius:10px;padding:12px;margin:10px 0
}
.notice{background:#452c2d;color:#ffd5d5}
.success{background:#174c36;color:#b7ffdb}
.info{background:#173e39;color:#c9edeb}
.progress{
 height:12px;background:#061b14;
 border-radius:20px;overflow:hidden;margin:10px 0
}
.progress>div{
 height:100%;background:linear-gradient(90deg,#1a9e72,#e8c77e);
 border-radius:20px
}
.schedule{
 background:var(--card2);border-left:3px solid var(--green);
 border-radius:0 11px 11px 0;
 padding:12px;margin:9px 0
}
.schedule.required{border-color:var(--gold)}
.schedule.done{opacity:.65}
.schedule.current{outline:1px solid var(--green)}
.time{color:var(--gold);font-weight:800}
.name{font-weight:750;margin:6px 0}
.chip{
 display:inline-block;border:1px solid var(--line);
 border-radius:20px;padding:4px 8px;
 font-size:11px;color:var(--muted);margin:3px
}
.checkline{
 display:flex;align-items:center;gap:9px;
 color:var(--text);margin-top:12px
}
.checkline input{
 width:20px;height:20px;accent-color:var(--green);
 flex:none
}
.timeline{
 border-left:2px solid var(--line);
 padding-left:14px;margin-left:7px
}
.timer{
 font-size:48px;font-weight:800;color:var(--gold);
 text-align:center;font-variant-numeric:tabular-nums;
 margin:16px 0
}
.battery{
 width:140px;height:140px;border-radius:50%;
 display:grid;place-items:center;margin:12px auto;
 background:conic-gradient(var(--green) var(--percent),#254638 0)
}
.battery-inner{
 width:115px;height:115px;border-radius:50%;
 background:var(--card);display:grid;place-items:center
}
.battery-inner strong{font-size:35px;color:var(--gold)}
.calendar{
 display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
 gap:4px
}
.day{
 background:var(--card2);border-radius:8px;
 text-align:center;padding:8px 2px
}
.day small{display:block;color:var(--muted);font-size:9px}
pre{
 white-space:pre-wrap;overflow-wrap:anywhere;
 background:#071e16;padding:12px;border-radius:9px
}
details{margin-top:12px}
summary{color:var(--gold);cursor:pointer}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.empty{color:var(--muted);padding:12px 0}
.bar{
 height:9px;background:#061b14;
 border-radius:9px;overflow:hidden;margin:7px 0
}
.bar>div{height:100%;background:var(--green)}
@media(max-width:380px){
 .card{padding:12px}
 .value{font-size:16px}
 .timer{font-size:40px}
}
</style>
</head>
<body>

<header>
 <div class="brand">◈ ORACLE <span>LIFE</span></div>
 <div class="motto">
 ПОРЯДОК В НАСТОЯЩЕМ. ВЛАСТЬ НАД БУДУЩИМ.
 </div>
 <div class="sub">
 MR. ARCANUM · INTELLIGENCE SYSTEM · 7.5
 </div>
</header>

<main id="main"></main>
<nav class="nav" id="nav"></nav>
<input type="file" id="backupFile" accept=".json" hidden>

<script>
"use strict";

/* ==========================================
   ORACLE LIFE 7.5
   INTELLIGENCE SYSTEM
   ========================================== */

const KEY="oracle-life-v71-clean";
const VERSION=75;
const $=id=>document.getElementById(id);

function uid(){
 return Date.now()+"-"+Math.random().toString(36).slice(2,9);
}

function dateKey(d=new Date()){
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}

function today(){return dateKey()}

function validDate(s){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return false;
 const d=new Date(s+"T12:00:00Z");
 return !isNaN(d)&&d.toISOString().slice(0,10)===s;
}

function dayNumber(s){
 return Math.floor(Date.parse(s+"T12:00:00Z")/86400000);
}

function addDays(s,n){
 return new Date((dayNumber(s)+n)*86400000)
 .toISOString().slice(0,10);
}

function nowMin(){
 const d=new Date();
 return d.getHours()*60+d.getMinutes();
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function cents(v){return Math.round(Number(v||0)*100)}
function amount(v){return Math.round(v)/100}
function round(v){return amount(cents(v))}
function sum(a,fn){return a.reduce((s,x)=>s+fn(x),0)}

function money(v){
 return Number(v||0).toLocaleString("ru-RU",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 })+" ₽";
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function card(title,html){
 return `<section class="card"><h2>${title}</h2>${html}</section>`;
}

function tile(label,value){
 return `<div class="tile">
 <div class="muted">${label}</div>
 <div class="value">${value}</div></div>`;
}

function btn(label,action,kind=""){
 return `<button type="button" class="btn ${kind}"
 data-action="${esc(action)}">${label}</button>`;
}

function row(label,value){
 return `<div class="row"><span>${esc(label)}</span>
 <b>${value}</b></div>`;
}

function progress(done,total){
 const p=total?clamp(Math.round(done/total*100),0,100):0;
 return `<div class="progress"><div style="width:${p}%"></div></div>
 <div class="muted">${p}% выполнено</div>`;
}

function tabs(items,selected,field){
 return `<div class="tabs">${items.map(([id,name])=>`
 <button data-${field}="${id}"
 class="${selected===id?"active":""}">${name}</button>
 `).join("")}</div>`;
}

function options(items,selected){
 return items.map(([id,name])=>`
 <option value="${esc(id)}" ${id===selected?"selected":""}>
 ${esc(name)}</option>`).join("");
}

const SHIFTS=[
 ["off","🏡 Выходной"],
 ["day","☀️ День 08:00–20:00"],
 ["night","🌙 Ночь 20:00–08:00"],
 ["recovery","😴 Отсыпной"]
];

const PLACES=[
 ["home","🏠 Дома"],
 ["work","🏭 На работе"],
 ["road","🚗 В дороге"],
 ["outside","🌍 Вне дома"]
];

const PRIORITIES=[
 ["high","🔴 Высокий"],
 ["normal","🟡 Обычный"],
 ["low","🟢 Низкий"]
];

const CATEGORIES=[
 ["food","🍽️ Еда"],
 ["groceries","🛒 Продукты"],
 ["transport","🚗 Транспорт"],
 ["subscriptions","💻 Подписки"],
 ["entertainment","🎮 Развлечения"],
 ["home","🏠 Дом"],
 ["health","💊 Здоровье"],
 ["project","🛠️ Проекты"],
 ["other","📦 Другое"]
];

function defaults(){
 return {
  version:75,
  tab:"home",
  more:"intelligence",
  intelTab:"patterns",
  financeTab:"budget",
  devTab:"import",

  salary:0,life:0,savings:0,bank:0,
  capital:10000,
  dailyLimit:0,
  limitMode:"auto",
  reservedBills:0,
  nextPayday:"",
  periodStart:"",
  periodId:"",
  lastClosedDay:"",

  salaryHistory:[],
  expenses:[],
  bankHistory:[],
  tasks:[],
  trades:[],
  reports:[],
  ideas:[],
  notes:[],

  raw:"",
  draft:null,

  shift:"off",
  location:"home",
  energy:7,
  sleep:8,
  sleepTime:"23:00",

  habits:[],
  dayPlans:{},
  dayHistory:{},
  dailyReviews:{},
  dailyState:{},

  financialGoals:[],
  focusSessions:[],

  plannerSettings:{breakMinutes:15},
  plannerMessage:"",
  lastActiveDate:"",

  focus:{
   active:false,
   paused:false,
   startedAt:null,
   elapsedBeforePause:0,
   targetMinutes:60,
   taskName:"",
   taskId:null,
   projectId:null
  },

  events:[],
  projects:[],
  milestones:[],
  moments:[],
  scenarios:[],
  appSettings:{
   notifications:false,
   showInsights:true
  }
 };
}

let db;

try{
 db={...defaults(),
 ...JSON.parse(localStorage.getItem(KEY)||"{}")};
}catch(e){
 console.error(e);
 db=defaults();
}

const ARRAY_FIELDS=[
 "salaryHistory","expenses","bankHistory",
 "tasks","trades","reports","ideas","notes",
 "habits","financialGoals","focusSessions",
 "events","projects","milestones","moments","scenarios"
];

function normalize(){
 for(const k of ARRAY_FIELDS){
  if(!Array.isArray(db[k]))db[k]=[];
 }

 for(const k of [
  "dayPlans","dayHistory","dailyReviews","dailyState"
 ]){
  if(!db[k]||typeof db[k]!=="object"||
   Array.isArray(db[k]))db[k]={};
 }

 if(!db.plannerSettings||
  typeof db.plannerSettings!=="object"){
  db.plannerSettings={breakMinutes:15};
 }

 if(!db.focus||typeof db.focus!=="object"){
  db.focus=defaults().focus;
 }

 if(!db.appSettings||
  typeof db.appSettings!=="object"){
  db.appSettings=defaults().appSettings;
 }

 if(!validDate(db.periodStart)){
  db.periodStart=today();
 }

 if(!db.periodId){
  db.periodId="legacy:"+db.periodStart;
 }

 if(!validDate(db.lastClosedDay)){
  db.lastClosedDay=addDays(today(),-1);
 }

 if(!validDate(db.lastActiveDate)){
  db.lastActiveDate=today();
 }

 db.energy=clamp(Number(db.energy)||7,1,10);
 db.sleep=clamp(Number(db.sleep)||0,0,24);

 db.version=VERSION;
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
  return true;
 }catch(e){
  console.error(e);
  alert("Не удалось сохранить данные. Проверь память устройства.");
  return false;
 }
}

function logEvent(type,title,details={},date=today()){
 db.events.push({
  id:uid(),
  type,
  title,
  details,
  date,
  at:new Date().toISOString()
 });
}

function state(date=today()){
 if(!db.dailyState[date]){
  db.dailyState[date]={
   date,
   shift:db.shift,
   location:db.location,
   energy:db.energy,
   sleep:db.sleep,
   sleepTime:db.sleepTime
  };
 }
 return db.dailyState[date];
}

function daySnapshot(date){
 const p=db.dayPlans[date];
 if(!p)return;

 const items=p.items||[];

 db.dayHistory[date]={
  date,
  total:items.length,
  completed:items.filter(x=>x.done).length,
  incomplete:items.filter(x=>!x.done).length,
  deferred:(p.deferred||[]).length,
  completedMinutes:sum(
   items.filter(x=>x.done),
   x=>Number(x.duration||0)
  ),
  shift:p.shift,
  energy:p.energy,
  sleep:p.sleep
 };
}

/* ==========================================
   DAILY RESET
   ========================================== */

function dailyReset(){
 const current=today();
 const previous=db.lastActiveDate;

 if(previous===current){
  state(current);
  return false;
 }

 if(validDate(previous)&&previous<current){
  const count=dayNumber(current)-dayNumber(previous);

  for(let i=0;i<Math.min(count,366);i++){
   daySnapshot(addDays(previous,i));
  }

  logEvent("day","Новый день",{
   previous,current
  });
 }

 db.lastActiveDate=current;

 state(current);

 db.plannerMessage=
  "☀️ Новый день! Вчерашние результаты сохранены. "+
  "Сегодняшние привычки начинаются без галочек.";

 save();
 return true;
}

/* ==========================================
   FINANCE ENGINE
   ========================================== */

function periodExpenses(){
 return db.expenses.filter(x=>
  x.date>=db.periodStart&&
  (!validDate(db.nextPayday)||x.date<db.nextPayday)
 );
}

function autoTransfers(){
 return db.bankHistory.filter(x=>
  x.type==="AUTO_SAVINGS"&&
  x.periodId===db.periodId
 );
}

function spentCents(before=null){
 return sum(periodExpenses().filter(
  x=>!before||x.date<before
 ),x=>cents(x.amount));
}

function savedCents(before=null){
 return sum(autoTransfers().filter(
  x=>!before||x.date<before
 ),x=>cents(x.amount));
}

function budgetAvailable(){
 return amount(
  cents(db.life)-
  spentCents()-
  savedCents()-
  cents(db.reservedBills)
 );
}

function financeStats(){
 const current=today();
 const valid=validDate(db.nextPayday)&&
  db.nextPayday>current;

 const days=valid?
  dayNumber(db.nextPayday)-dayNumber(current):0;

 const spent=sum(
  periodExpenses().filter(x=>x.date===current),
  x=>cents(x.amount)
 );

 const opening=cents(db.life)-
  cents(db.reservedBills)-
  spentCents(current)-
  savedCents(current);

 const limit=valid?
  (db.limitMode==="manual"?
   Math.max(0,cents(db.dailyLimit)):
   Math.max(0,Math.floor(opening/days))):0;

 return {
  valid,days,spent,limit,
  left:Math.max(0,Math.min(
   opening-spent,limit-spent
  ))
 };
}

function closeFinanceDays(){
 if(!validDate(db.periodStart)||
  !validDate(db.nextPayday)||
  db.nextPayday<=db.periodStart)return;

 const first=Math.max(
  dayNumber(db.periodStart),
  dayNumber(db.lastClosedDay)+1
 );

 const last=Math.min(
  dayNumber(today())-1,
  dayNumber(db.nextPayday)-1
 );

 if(last<first||last-first>3660)return;

 for(let n=first;n<=last;n++){
  const date=addDays(db.periodStart,
   n-dayNumber(db.periodStart));

  const exists=autoTransfers()
   .some(x=>x.date===date);

  if(exists){
   db.lastClosedDay=date;
   continue;
  }

  const opening=cents(db.life)-
   cents(db.reservedBills)-
   spentCents(date)-
   savedCents(date);

  const spent=sum(
   periodExpenses().filter(x=>x.date===date),
   x=>cents(x.amount)
  );

  const daysLeft=dayNumber(db.nextPayday)-n;

  const limit=db.limitMode==="manual"?
   Math.max(0,cents(db.dailyLimit)):
   Math.max(0,Math.floor(opening/daysLeft));

  const transfer=Math.max(
   0,Math.min(opening-spent,limit-spent)
  );

  if(transfer>0){
   db.bankHistory.push({
    id:"auto:"+db.periodId+":"+date,
    date,
    amount:amount(transfer),
    type:"AUTO_SAVINGS",
    note:"Остаток дневного лимита",
    periodId:db.periodId
   });

   db.bank=amount(cents(db.bank)+transfer);

   logEvent("finance","Перевод остатка в Банк",{
    amount:amount(transfer)
   },date);
  }

  db.lastClosedDay=date;
 }

 save();
}

function startPeriod(d){
 db.salary=round(d.salary);
 db.life=round(d.life);
 db.savings=round(d.savings);
 db.bank=round(d.bank);

 db.periodStart=d.date;
 db.nextPayday=d.nextPayday;
 db.periodId=uid();
 db.lastClosedDay=addDays(d.date,-1);
 db.reservedBills=0;

 db.salaryHistory.push({
  id:uid(),
  date:d.date,
  period:d.period,
  salary:db.salary,
  life:db.life,
  savings:db.savings,
  bank:db.bank,
  periodId:db.periodId
 });

 logEvent("finance","Новый финансовый период",{
  salary:db.salary
 });
}

/* ==========================================
   PLANNER
   ========================================== */

function minutes(s){
 const [h,m]=String(s||"00:00").split(":").map(Number);
 return h*60+m;
}

function clock(n){
 n=((Math.floor(n)%1440)+1440)%1440;
 return String(Math.floor(n/60)).padStart(2,"0")+":"+
 String(n%60).padStart(2,"0");
}

function sleepBlocks(){
 const duration=clamp(
  Math.round(Number(db.sleep||0)*60),0,1440
 );

 if(duration===0)return [];
 if(duration===1440)return [[0,1440]];

 const start=minutes(db.sleepTime||"23:00");
 const end=start+duration;

 return end<=1440?
  [[start,end]]:
  [[start,1440],[0,end-1440]];
}

function busyBlocks(){
 const blocks=[...sleepBlocks()];

 if(db.shift==="day")blocks.push([480,1200]);

 if(db.shift==="night"){
  blocks.push([0,480],[1200,1440]);
 }

 if(db.shift==="recovery"){
  blocks.push([480,720]);
 }

 return blocks;
}

function freeWindows(){
 const blocks=busyBlocks()
 .sort((a,b)=>a[0]-b[0]);

 const merged=[];

 for(const block of blocks){
  const last=merged[merged.length-1];

  if(last&&block[0]<=last[1]){
   last[1]=Math.max(last[1],block[1]);
  }else{
   merged.push([...block]);
  }
 }

 const windows=[];
 let cursor=nowMin();

 for(const [a,b] of merged){
  if(a>cursor)windows.push([cursor,a]);
  cursor=Math.max(cursor,b);
 }

 if(cursor<1440)windows.push([cursor,1440]);

 return windows;
}

function priority(p){
 return p==="high"?3:p==="normal"?2:1;
}

function adjustedDuration(item){
 const base=clamp(Number(item.duration)||60,5,720);

 if(item.required)return base;

 let factor=1;

 if(db.energy<=3)factor=.45;
 else if(db.energy<=5)factor=.7;
 else if(db.energy>=9)factor=1.1;

 if(db.sleep<6)factor=Math.min(factor,.65);

 return clamp(Math.round(base*factor/5)*5,5,720);
}

function candidates(){
 const habits=db.habits
 .filter(x=>x.active!==false)
 .map(x=>({...x,source:"habit",sourceId:x.id}));

 const tasks=db.tasks
 .filter(x=>!x.done&&
  (!x.scheduledDate||x.scheduledDate<=today()))
 .map(x=>({...x,source:"task",sourceId:x.id}));

 return [...habits,...tasks].sort((a,b)=>{
  if(Boolean(a.required)!==Boolean(b.required)){
   return a.required?-1:1;
  }
  return priority(b.priority)-priority(a.priority);
 });
}

function plan(){return db.dayPlans[today()]||null}

function planStats(){
 const p=plan();

 if(!p)return {
  total:0,done:0,pending:0,deferred:0,minutes:0
 };

 return {
  total:p.items.length,
  done:p.items.filter(x=>x.done).length,
  pending:p.items.filter(x=>!x.done).length,
  deferred:p.deferred.length,
  minutes:sum(
   p.items.filter(x=>x.done),
   x=>Number(x.duration||0)
  )
 };
}

function buildPlan(){
 const date=today();
 const old=plan();

 const fixed=old?
  old.items.filter(x=>x.done).map(x=>({...x})):[];
 const deferred=[];
 const items=[...fixed];

 const breaks=clamp(
  Number(db.plannerSettings.breakMinutes)||0,0,60
 );

 const windows=freeWindows();

 const postponed=new Set(
  (old?.deferred||[])
  .filter(x=>x.reason==="Изменение планов")
  .map(x=>x.source+":"+x.sourceId)
 );

 const occupied=fixed.map(x=>[x.start,x.end]);

 for(const task of candidates()){
  const key=task.source+":"+task.sourceId;

  if(items.some(x=>
   x.source===task.source&&
   String(x.sourceId)===String(task.sourceId)
  ))continue;

  if(postponed.has(key)){
   deferred.push({
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:task.required,
    reason:"Изменение планов"
   });
   continue;
  }

  if(task.place&&task.place!=="any"&&
   task.place!==db.location){
   deferred.push({
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:task.required,
    reason:"Недоступно в текущем месте"
   });
   continue;
  }

  const duration=adjustedDuration(task);
  let placed=false;

  for(const window of windows){
   let start=window[0];

   const overlaps=occupied
    .filter(([a,b])=>b>start&&a<window[1])
    .sort((a,b)=>a[0]-b[0]);

   for(const [a,b] of overlaps){
    if(start+duration<=a)break;
    if(start<b)start=b+breaks;
   }

   if(start+duration>window[1])continue;

   const item={
    id:uid(),
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    priority:task.priority||"normal",
    projectId:task.projectId||null,
    start,end:start+duration,
    duration,done:false
   };

   items.push(item);
   occupied.push([item.start,item.end]);
   window[0]=item.end+breaks;
   placed=true;
   break;
  }

  if(!placed){
   deferred.push({
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    reason:"Недостаточно времени"
   });
  }
 }

 items.sort((a,b)=>a.start-b.start);

 db.dayPlans[date]={
  date,
  createdAt:new Date().toISOString(),
  shift:db.shift,
  location:db.location,
  energy:db.energy,
  sleep:db.sleep,
  items,deferred
 };

 db.plannerMessage=
  "План построен. Задач: "+items.length+
  ". Отложено: "+deferred.length+".";

 daySnapshot(date);
 logEvent("plan","Расписание сформировано",{
  tasks:items.length
 });

 save();
}

function markDone(id,done){
 const p=plan();
 if(!p)return;

 const item=p.items.find(x=>String(x.id)===String(id));
 if(!item)return;

 item.done=done;

 if(item.source==="task"){
  const task=db.tasks.find(
   x=>String(x.id)===String(item.sourceId)
  );

  if(task)task.done=done;
 }

 if(done){
  logEvent("task","Выполнено: "+item.name,{
   source:item.source,
   sourceId:item.sourceId,
   projectId:item.projectId
  });
 }

 daySnapshot(today());
 save();
}

function emergency(){
 const p=plan();
 if(!p)return;

 for(const item of p.items.filter(x=>!x.done)){
  if(!p.deferred.some(x=>
   x.source===item.source&&
   String(x.sourceId)===String(item.sourceId)
  )){
   p.deferred.push({
    source:item.source,
    sourceId:item.sourceId,
    name:item.name,
    required:item.required,
    reason:"Изменение планов"
   });
  }
 }

 p.items=p.items.filter(x=>x.done);

 db.plannerMessage=
  "Выполненное сохранено. Остальное отложено.";

 daySnapshot(today());
 save();
}

 .filter(x=>!x.done&&x.end>nowMin())
 .sort((a,b)=>a.start-b.start)[0]||null;
}

function batteryScore(date=today()){
 const s=db.dailyState[date]||state(date);
 const p=db.dayPlans[date];

 const planned=p?sum(
  p.items.filter(x=>!x.done),
  x=>Number(x.duration||0)
 ):0;

 const shiftPenalty={
  off:0,day:10,night:18,recovery:12
 }[s.shift]||0;

 const score=clamp(Math.round(
  Number(s.energy||7)*7+
  Math.min(Number(s.sleep||8),9)*4-
  shiftPenalty-
  Math.max(0,planned-180)/30
 ),0,100);

 return {
  score,planned,
  status:score>=70?"Хороший запас":
   score>=40?"Умеренная нагрузка":"Возможная перегрузка",
  advice:score>=70?
   "Можно придерживаться обычного плана.":
   score>=40?
   "Оставь перерывы между сложными задачами.":
   "Сократи гибкие задачи и оставь время на отдых."
 };
}

/* ==========================================
   ORACLE PATTERNS
   ========================================== */

function dayCompletion(date){
 const h=db.dayHistory[date];
 if(!h||!h.total)return null;
 return h.completed/h.total;
}

function patternInsights(){
 const result=[];
 const dates=Object.keys(db.dayHistory)
 .filter(x=>validDate(x))
 .sort();

 const withSleep=dates.filter(x=>
  db.dayHistory[x]?.sleep!=null&&
  dayCompletion(x)!=null
 );

 const low=withSleep.filter(x=>
  db.dayHistory[x].sleep<6
 );

 const normal=withSleep.filter(x=>
  db.dayHistory[x].sleep>=7
 );

 if(low.length>=5&&normal.length>=5){
  const a=sum(low,x=>dayCompletion(x))/low.length;
  const b=sum(normal,x=>dayCompletion(x))/normal.length;

  result.push({
   title:"Сон и выполнение задач",
   detail:"При сне менее 6 часов: "+
    Math.round(a*100)+"%. При сне от 7 часов: "+
    Math.round(b*100)+"%.",
   samples:low.length+normal.length,
   note:"Сравнение не доказывает причинно-следственную связь."
  });
 }

 const nights=dates.filter(x=>
  db.dayHistory[x]?.shift==="night"&&
  dayCompletion(x)!=null
 );

 const days=dates.filter(x=>
  db.dayHistory[x]?.shift==="off"&&
  dayCompletion(x)!=null
 );

 if(nights.length>=5&&days.length>=5){
  const a=sum(nights,x=>dayCompletion(x))/nights.length;
  const b=sum(days,x=>dayCompletion(x))/days.length;

  result.push({
   title:"Ночные смены и результативность",
   detail:"После ночных смен: "+
    Math.round(a*100)+"%. В выходные: "+
    Math.round(b*100)+"%.",
   samples:nights.length+days.length,
   note:"Сравнение групп, не доказательство причины."
  });
 }

 const recent=dates.slice(-14);
 const completed=recent.map(dayCompletion)
 .filter(x=>x!==null);

 if(completed.length>=7){
  result.push({
   title:"Выполнение планов",
   detail:"Средний процент выполнения за "+
    completed.length+" дней: "+
    Math.round(sum(completed,x=>x)/completed.length*100)+"%.",
   samples:completed.length,
   note:"Учитываются только дни с сохранённым планом."
  });
 }

 return result;
}

function categoryName(id){
 return CATEGORIES.find(x=>x[0]===id)?.[1]||"📦 Другое";
}

function expenseCategory(x){
 return x.category||"other";
}

function moneyLeaks(){
 const end=today();
 const start=addDays(end,-29);

 const expenses=db.expenses.filter(x=>
  x.date>=start&&x.date<=end
 );

 const groups={};

 for(const e of expenses){
  const k=expenseCategory(e);
  groups[k]??={count:0,total:0};
  groups[k].count++;
  groups[k].total+=Number(e.amount)||0;
 }

 return Object.entries(groups)
 .map(([category,data])=>({
  category,...data
 }))
 .sort((a,b)=>b.total-a.total);
}

/* ==========================================
   FOCUS TIMER
   ========================================== */

function focusElapsed(){
 const f=db.focus;
 let seconds=Number(f.elapsedBeforePause)||0;

 if(f.active&&!f.paused&&f.startedAt){
  seconds+=Math.max(
   0,Math.floor((Date.now()-f.startedAt)/1000)
  );
 }

 return seconds;
}

function focusRemaining(){
 return Math.max(0,
  Number(db.focus.targetMinutes||60)*60-focusElapsed()
 );
}

function formatSeconds(n){
 n=Math.max(0,Math.floor(n));

 const h=Math.floor(n/3600);
 const m=Math.floor(n%3600/60);
 const s=n%60;

 return (h?String(h).padStart(2,"0")+":":"")+
 String(m).padStart(2,"0")+":"+
 String(s).padStart(2,"0");
}

function startFocus(){
 const duration=Number($("focusDuration").value);
 const name=$("focusName").value.trim();
 const projectId=$("focusProject")?.value||null;

 if(!Number.isFinite(duration)||
  duration<1||duration>1440){
  alert("Длительность: от 1 до 1440 минут.");
  return;
 }

 db.focus={
  active:true,paused:false,
  startedAt:Date.now(),
  elapsedBeforePause:0,
  targetMinutes:duration,
  taskName:name||"Концентрация",
  projectId
 };

 logEvent("focus","Начало концентрации",{
  name,duration,projectId
 });

 save();
}

function pauseFocus(){
 const f=db.focus;
 if(!f.active)return;

 if(f.paused){
  f.startedAt=Date.now();
  f.paused=false;
 }else{
  f.elapsedBeforePause=focusElapsed();
  f.startedAt=null;
  f.paused=true;
 }

 save();
}

function finishFocus(){
 const f=db.focus;
 if(!f.active)return;

 const elapsed=focusElapsed();
 const minutesWorked=Math.round(elapsed/60);

 if(elapsed>=60){
  db.focusSessions.push({
   id:uid(),
   date:today(),
   name:f.taskName,
   minutes:minutesWorked,
   projectId:f.projectId||null,
   completed:elapsed>=f.targetMinutes*60
  });

  logEvent("focus","Завершена концентрация",{
   name:f.taskName,
   minutes:minutesWorked,
   projectId:f.projectId
  });
 }

 db.focus=defaults().focus;
 generateMoments();
 save();
}

const HEADINGS={
 "ПРОЕКТ":"project",
 "ПОМОЩНИК":"agent",
 "ДАТА":"date",

 "ГДЕ ОСТАНОВИЛИСЬ":"stop",

function parseReport(raw){
 const result={};
 let current="";

 for(const line of raw.split(/\r?\n/)){
  const m=line.match(/^([^:]{2,60}):\s*(.*)$/);
  const heading=m?.[1]?.trim().toUpperCase();

  if(heading&&HEADINGS[heading]){
   current=HEADINGS[heading];
   result[current]=m[2]||"";
  }else if(current){
   result[current]+="\n"+line;
  }
 }

 return result;
}

function copy(text){
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(text).then(
   ()=>alert("Скопировано"),
   ()=>prompt("Скопируй:",text)
  );
 }else{
  prompt("Скопируй:",text);
 }
}

/* ==========================================
   BUTTON ACTIONS
   ========================================== */

document.addEventListener("click",e=>{
 const el=e.target.closest(
  "[data-tab],[data-more],[data-finance],"+
  "[data-intel],[data-dev],[data-action]"
 );

 if(!el)return;

 for(const [field,key] of [
  ["tab","tab"],
  ["more","more"],
  ["finance","financeTab"],
  ["intel","intelTab"],
  ["dev","devTab"]
 ]){
  if(el.dataset[field]){
   db[key]=el.dataset[field];
   render();
   return;
  }
 }

 const action=el.dataset.action;
 if(!action)return;

 if(action==="go-plans"){go("plans");return}
 if(action==="go-focus"){go("focus");return}
 if(action==="go-review"){go("review");return}

 if(action==="go-intelligence"){
  db.more="intelligence";
  db.intelTab="patterns";
  go("more");
  return;
 }

 if(action==="go-future"){
  db.more="intelligence";
  db.intelTab="future";
  go("more");
  return;
 }

 if(action==="open-salary"){
  db.financeTab="salary";
  go("finance");
  return;
 }

 if(action==="save-day"){
  const energy=Number($("energy").value);
  const sleep=Number($("sleep").value);
  const breaks=Number($("breakMinutes").value);

  if(!Number.isFinite(energy)||energy<1||energy>10||
   !Number.isFinite(sleep)||sleep<0||sleep>24||
   !Number.isFinite(breaks)||breaks<0||breaks>60){
   alert("Проверь параметры дня.");
   return;
  }

  db.shift=$("shift").value;
  db.location=$("location").value;
  db.energy=energy;
  db.sleep=sleep;
  db.sleepTime=$("sleepTime").value;
  db.plannerSettings.breakMinutes=breaks;

  db.dailyState[today()]={
   date:today(),
   shift:db.shift,
   location:db.location,
   energy:db.energy,
   sleep:db.sleep,
   sleepTime:db.sleepTime
  };

  logEvent("day","Настройки дня сохранены",{
   energy,sleep,shift:db.shift
  });

  buildPlan();
 }

 if(action==="build-plan")buildPlan();

 if(action==="emergency"){
  if(confirm("Отложить невыполненные дела?")){
   emergency();
  }
 }

 if(action==="focus-start")startFocus();
 if(action==="focus-pause")pauseFocus();
 if(action==="focus-finish")finishFocus();

 if(action==="save-limit"){
  const limit=Number($("dailyLimit").value);
  const reserve=Number($("reservedBills").value);

  if(!Number.isFinite(limit)||limit<0||
   !Number.isFinite(reserve)||reserve<0||
   reserve>db.life){
   alert("Проверь лимит и резерв.");
   return;
  }

  db.dailyLimit=round(limit);
  db.reservedBills=round(reserve);
  db.limitMode=$("limitMode").value;
 }

 if(action==="save-capital"){
  const value=Number($("capital").value);

  if(!Number.isFinite(value)||value<0){
   alert("Неверный капитал.");
   return;
  }

  db.capital=round(value);
 }

 if(action.startsWith("delete-habit-")){
  const id=action.slice(13);

  if(confirm("Удалить привычку?")){
   db.habits=db.habits.filter(x=>String(x.id)!==id);
  }
 }

 if(action.startsWith("delete-task-")){
  const id=action.slice(12);

  if(confirm("Удалить задачу?")){
   db.tasks=db.tasks.filter(x=>String(x.id)!==id);
  }
 }

 if(action.startsWith("move-task-")){
  const id=action.slice(10);
  const task=db.tasks.find(x=>String(x.id)===id);

  if(task){
   const date=prompt(
    "Новая дата ГГГГ-ММ-ДД",
    addDays(today(),1)
   );

   if(date!==null){
    if(!validDate(date)){
     alert("Неверная дата.");
     return;
    }

    task.scheduledDate=date;
    task.deferred=true;

    const p=plan();
    if(p){
     p.items=p.items.filter(x=>
      !(x.source==="task"&&String(x.sourceId)===id)
     );
     p.deferred=p.deferred.filter(x=>
      !(x.source==="task"&&String(x.sourceId)===id)
     );
     daySnapshot(today());
    }

    logEvent("task","Задача перенесена",{
     name:task.name,date
    });
   }
  }
 }

 if(action.startsWith("category-")){
  const id=action.slice(9);
  const expense=db.expenses.find(x=>String(x.id)===id);

  if(expense){
   const text=CATEGORIES.map(
    ([id,name])=>id+" — "+name
   ).join("\n");

   const value=prompt(
    "Введи код категории:\n"+text,
    expenseCategory(expense)
   );

   if(value!==null){
    if(!CATEGORIES.some(x=>x[0]===value)){
     alert("Неизвестная категория.");
     return;
    }
    expense.category=value;
   }
  }
 }

 if(action.startsWith("delete-expense-")){
  const id=action.slice(15);
  const x=db.expenses.find(y=>String(y.id)===id);

  if(x&&x.date<=db.lastClosedDay&&
   x.date>=db.periodStart){
   alert(
    "День уже закрыт. Удаление расхода "+
    "может нарушить историю бюджета."
   );
   return;
  }

  if(confirm("Удалить расход?")){
   db.expenses=db.expenses.filter(x=>String(x.id)!==id);
  }
 }

 if(action.startsWith("goal-add-")){
  const id=action.slice(9);
  const goal=db.financialGoals.find(x=>String(x.id)===id);

  if(goal){
   const raw=prompt("Добавить к цели, ₽?");

   if(raw!==null){
    const value=Number(raw.replace(",","."));

    if(!Number.isFinite(value)||value<=0){
     alert("Неверная сумма.");
     return;
    }

    goal.saved=round(Number(goal.saved)+value);
    generateMoments();
   }
  }
 }

 if(action.startsWith("goal-delete-")){
  const id=action.slice(12);

  if(confirm("Удалить цель?")){
   db.financialGoals=db.financialGoals.filter(
    x=>String(x.id)!==id
   );
  }
 }

 if(action.startsWith("add-milestone-")){
  const projectId=action.slice(14);
  const name=prompt("Название нового этапа:");

  if(name?.trim()){
   db.milestones.push({
    id:uid(),
    projectId,
    name:name.trim(),
    done:false
   });
  }
 }

 if(action.startsWith("delete-project-")){
  const id=action.slice(15);

  if(confirm("Удалить проект и его этапы?")){
   db.projects=db.projects.filter(x=>String(x.id)!==id);
   db.milestones=db.milestones.filter(x=>x.projectId!==id);
  }
 }

 if(action==="open-replay"){
  const date=$("replayDate").value;

  if(!validDate(date)||date>today()){
   alert("Неверная дата.");
   return;
  }

  db.replayDate=date;
 }

 if(action==="calculate-whatif"){
  const daily=Number($("whatDaily").value);
  const months=Number($("whatMonths").value);
  const hours=Number($("whatHours").value);

  if(!Number.isFinite(daily)||daily<0||
   !Number.isFinite(months)||months<1||months>120||
   !Number.isFinite(hours)||hours<0||hours>168){
   alert("Проверь параметры сценария.");
   return;
  }

  db.whatIf={daily,months,hours};
 }

 if(action==="parse-report"){
  db.raw=$("rawReport").value;
  db.draft=parseReport(db.raw);
  db.devTab="fields";
 }

 if(action==="clear-report"){
  db.raw="";
  db.draft=null;
 }

 if(action==="copy-last"){
  if(db.reports[0]){
   copy(JSON.stringify(db.reports[0],null,2));
  }
 }

 if(action==="delete-last"){

 }

 if(action.startsWith("open-report-")){
  const i=Number(action.slice(12));
  const report=db.reports[i];

 if(action.startsWith("delete-report-")){

  if(confirm("Удалить отчёт?")){

  }

 if(action==="check-day"){

 if(action==="export"){

  const blob=new Blob([json],{

  });

  link.download="oracle-life-"+today()+".json";

  link.click();

 }

 if(action==="import")$("backupFile").click();

 if(action==="reset"){

 generateMoments();
 render();
});

/* ==========================================
   FORMS
   ========================================== */

document.addEventListener("submit",e=>{
 const form=e.target.closest("form[data-form]");
 if(!form)return;

 e.preventDefault();

 const data=Object.fromEntries(new FormData(form));
 const type=form.dataset.form;

 if(type==="habit"||type==="task"){
  const duration=Number(data.duration);

  if(!data.name.trim()||
   !Number.isFinite(duration)||
   duration<5||duration>720){
   alert("Проверь название и длительность.");
   return;
  }

  const item={
   id:uid(),
   name:data.name.trim(),
   duration,
   required:data.required==="true",
   priority:data.priority,
   place:data.place,
   active:true,
   done:false
  };

  if(type==="habit"){
   db.habits.push(item);
  }else{
   if(!validDate(data.scheduledDate)){
    alert("Неверная дата.");
    return;
   }

   item.scheduledDate=data.scheduledDate;
   item.projectId=data.projectId||null;
   db.tasks.push(item);
  }

  db.plannerMessage="Дело добавлено. Перестрой расписание.";
 }

 if(type==="salary"){
  const values=[
   data.salary,data.life,data.savings,data.bank
  ].map(cents);

  if(values.some(x=>!Number.isSafeInteger(x)||x<0)||
   values[1]+values[2]+values[3]>values[0]){
   alert("Проверь распределение зарплаты.");
   return;
  }

  if(!validDate(data.date)||
   !validDate(data.nextPayday)||
   data.nextPayday<=data.date||
   data.nextPayday<=today()||
   data.date>today()){
   alert("Проверь даты.");
   return;
  }

  if(db.salaryHistory.length&&!confirm(
   "Начать новый период? Баланс Банка "+
   "будет заменён введённым значением."
  ))return;

  startPeriod(data);
 }

 if(type==="expense"){
  const value=cents(data.amount);

  if(!data.name.trim()||
   !Number.isSafeInteger(value)||value<=0){
   alert("Проверь расход.");
   return;
  }

  db.expenses.push({
   id:uid(),
   name:data.name.trim(),
   amount:amount(value),
   category:data.category,
   date:today()
  });

  logEvent("expense","Расход: "+data.name,{
   amount:amount(value),
   category:data.category
  });
 }

 if(type==="bank"){
  const value=cents(data.amount);
  const take=e.submitter?.value==="take";

  if(!Number.isSafeInteger(value)||value<=0){
   alert("Неверная сумма.");
   return;
  }

  if(take&&value>cents(db.bank)){
   alert("Недостаточно денег.");
   return;
  }

  db.bank=amount(
   cents(db.bank)+(take?-value:value)
  );

  db.bankHistory.push({
   id:uid(),
   date:today(),
   amount:amount(take?-value:value),
   note:take?"Снятие":"Пополнение",
   type:take?"MANUAL_WITHDRAW":"MANUAL_DEPOSIT"
  });

  logEvent("finance",take?
   "Снятие из Банка":"Пополнение Банка",{
   amount:amount(value)
  });
 }

 if(type==="goal"){
  const target=Number(data.target);
  const saved=Number(data.saved);

  if(!data.name.trim()||
   !Number.isFinite(target)||target<=0||
   !Number.isFinite(saved)||saved<0){
   alert("Проверь финансовую цель.");
   return;
  }

  db.financialGoals.push({
   id:uid(),
   name:data.name.trim(),
   target:round(target),
   saved:round(saved)
  });

  generateMoments();
 }

 if(type==="trade"){
  const stake=Number(data.stake);
  const payout=Number(data.payout);
  const result=e.submitter?.value==="loss"?
   "loss":"win";

  if(!Number.isFinite(stake)||stake<=0||
   !Number.isFinite(payout)||payout<0||payout>100){
   alert("Проверь сделку.");
   return;
  }

  const trades=db.trades.filter(x=>x.date===today());

  let streak=0;
  for(let i=trades.length-1;i>=0;i--){
   if(trades[i].result==="loss")streak++;
   else break;
  }

  if(trades.length>=5||streak>=2){
   if(!confirm("Торговый лимит достигнут. Записать?")){
    return;
   }
  }

  if(stake>(db.capital+pnl())*.01){
   if(!confirm("Ставка больше 1% капитала. Записать?")){
    return;
   }
  }

  const trade={
   id:uid(),
   date:today(),
   asset:data.asset,
   tf:data.tf,
   direction:data.direction,
   stake:round(stake),
   payout,result,
   pnl:result==="win"?
    round(stake*payout/100):-round(stake)
  };

  db.trades.push(trade);

  logEvent("trade","Сделка "+result.toUpperCase(),{
   asset:trade.asset,pnl:trade.pnl
  });
 }

 if(type==="project"){
  if(!data.name.trim())return;

  db.projects.push({
   id:uid(),
   name:data.name.trim(),
   description:data.description||"",
   deadline:data.deadline||"",
   createdAt:today()
  });

  logEvent("project","Создан проект: "+data.name);
 }

 if(type==="moment"){
  if(!data.title.trim()||!validDate(data.date))return;

  db.moments.push({
   id:uid(),
   title:data.title.trim(),
   date:data.date,
   automatic:false
  });
 }

 if(type==="review"){
  const rating=Number(data.rating);

  if(!Number.isFinite(rating)||
   rating<1||rating>10||
   !data.text.trim()){
   alert("Проверь итог дня.");
   return;
  }

  db.dailyReviews[today()]={
   rating,
   text:data.text.trim(),
   savedAt:new Date().toISOString()
  };

  logEvent("review","Вечерний итог",{
   rating
  });

  daySnapshot(today());
  db.tab="home";
 }

 if(type==="report"){
  db.reports.unshift({
   ...data,
   id:uid(),
   date:data.date||today(),
   source:db.raw
  });

  db.devTab="latest";
 }

 if(type==="idea"&&data.text.trim()){
  db.ideas.push(data.text.trim());
 }

 if(type==="note"&&data.text.trim()){
  db.notes.push({
   date:today(),
   text:data.text.trim()
  });
 }

 generateMoments();
 render();
});

/* ==========================================
   JSON IMPORT
   ========================================== */

$("backupFile").addEventListener("change",async e=>{
 const file=e.target.files?.[0];
 if(!file)return;

 try{
  const obj=JSON.parse(await file.text());

  if(obj.app!=="ORACLE LIFE"||
   !obj.data||
   typeof obj.data!=="object"||
   Array.isArray(obj.data)){
   throw new Error("Неверный формат резервной копии");
  }

  const restored={...defaults(),...obj.data};

  for(const k of ARRAY_FIELDS){
   if(restored[k]!==undefined&&
    !Array.isArray(restored[k])){
    throw new Error("Повреждён раздел "+k);
   }
  }

  if(confirm("Заменить текущие данные резервной копией?")){
   db=restored;
   normalize();
   dailyReset();
   closeFinanceDays();
   generateMoments();
   render();
  }
 }catch(error){
  alert("Ошибка импорта: "+error.message);
 }

 e.target.value="";
});

/* ==========================================
   AUTOMATIC DAILY UPDATE
   ========================================== */

function tick(){
 if(db.lastActiveDate!==today()){
  dailyReset();
  closeFinanceDays();
  render();
  return;
 }

 const timer=$("timerDisplay");

 if(timer&&db.focus.active){
  timer.textContent=formatSeconds(focusRemaining());
 }
}

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden){
  dailyReset();
  closeFinanceDays();
  render();
 }
});

window.addEventListener("focus",()=>{
 dailyReset();
 closeFinanceDays();
 render();
});

window.addEventListener("error",e=>{
 console.error("ORACLE LIFE:",e.error||e.message);
});

/* ==========================================
   START
   ========================================== */

normalize();
dailyReset();
closeFinanceDays();
generateMoments();
render();

setInterval(tick,15000);

</script>
</body>
</html>
