
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORACLE LIFE</title>
<style>
:root{
 --bg:#061611;
 --card:#102c22;
 --card2:#183d2e;
 --gold:#ebc77e;
 --green:#27dfa0;
 --text:#e7f1e9;
 --muted:#aac6b5;
 --line:#315e49;
 --red:#ffabab;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font:14px system-ui,Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{
 padding:22px 16px;
 background:linear-gradient(110deg,#123b2a,#061611);
 border-bottom:1px solid var(--line)
}
.brand{font:800 30px Georgia,serif;color:var(--gold)}
.brand span{color:var(--green)}
.slogan{color:var(--gold);font-size:11px;margin-top:9px}
.sub{color:var(--muted);margin-top:12px}
main{max-width:760px;margin:auto;padding:14px 14px 110px}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:16px;padding:16px;margin-bottom:14px
}
h2{color:var(--gold);font-size:19px;margin:0 0 14px}
h3{color:var(--gold);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card2);padding:13px;border-radius:11px}
.value{font-size:20px;font-weight:800;color:var(--gold);overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:12px;line-height:1.6}
label{display:block;color:var(--gold);margin:12px 0 5px}
input,textarea,select{
 width:100%;padding:12px;background:#071d16;color:white;
 border:1px solid #417058;border-radius:9px
}
textarea{min-height:110px;resize:vertical}
button.btn{
 border:0;border-radius:10px;padding:12px;
 background:var(--green);color:#042419;font-weight:800
}
button.alt{background:#22503b;color:white;border:1px solid #47775d}
button.danger{background:#69373c;color:white}
.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.buttons button{flex:1}
.row{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:11px 0;border-bottom:1px solid var(--line)
}
.row span{color:var(--gold);overflow-wrap:anywhere}
.row small{color:var(--muted)}
.nav{
 position:fixed;bottom:0;left:0;right:0;
 display:grid;grid-template-columns:repeat(5,1fr);
 background:#09251b;border-top:1px solid var(--line);
 padding:7px 3px calc(7px + env(safe-area-inset-bottom));
 z-index:10
}
.nav button{
 background:none;border:0;color:#c3d8c9;
 padding:9px 2px;border-radius:10px;font-size:11px
}
.nav button.active{background:#20533c;color:var(--gold)}
.nav b{display:block;font-size:20px;margin-bottom:4px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px}
.tabs button{
 flex-shrink:0;background:#183b2d;color:white;
 border:1px solid var(--line);padding:10px;border-radius:9px
}
.tabs button.active{color:var(--gold);border-color:var(--gold)}
.green{color:var(--green)}
.red{color:var(--red)}
.notice{background:#42272b;border-radius:10px;padding:13px;color:#ffd1d1}
pre{
 white-space:pre-wrap;overflow-wrap:anywhere;
 background:#071d16;border-radius:10px;padding:12px
}
.check{width:19px;height:19px;accent-color:var(--green)}
</style>
</head>
<body>

<header>
 <div class="brand">◈ ORACLE <span>LIFE</span></div>
 <div class="slogan">ПОРЯДОК В НАСТОЯЩЕМ. ВЛАСТЬ НАД БУДУЩИМ.</div>
 <div class="sub">MR. ARCANUM · Личный командный центр</div>
</header>

<main id="main">Загрузка ORACLE LIFE...</main>
<nav class="nav" id="nav"></nav>
<input id="backupFile" type="file" accept=".json" hidden>

<script>
"use strict";

const KEY="oracle-life-v7";
const OLD="oracle-life-v6-demo";

const today=()=>{
 const d=new Date();
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
};

const defaults=()=>({
 tab:"home",
 more:"dev",
 financeTab:"budget",
 devTab:"import",
 shift:"off",
 life:20000,
 bank:0,
 limit:2000,
 capital:10000,
 expenses:[],
 bankHistory:[],
 tasks:[],
 trades:[],
 reports:[],
 ideas:[],
 notes:[],
 raw:"",
 draft:null,
 energy:7,
 sleep:8
});

let db;

try{
 const saved=localStorage.getItem(KEY);
 const legacy=localStorage.getItem(OLD);
 const data=JSON.parse(saved||legacy||"{}");
 db={...defaults(),...data};
}catch(e){
 db=defaults();
 console.error("Storage:",e);
}

for(const name of [
 "expenses","bankHistory","tasks","trades",
 "reports","ideas","notes"
]){
 if(!Array.isArray(db[name]))db[name]=[];
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
 }catch(e){
  console.error(e);
  alert("Не удалось сохранить данные. Проверь память устройства.");
 }
}

const money=n=>
 Number(n||0).toLocaleString("ru-RU",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 })+" ₽";

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));

const el=id=>document.getElementById(id);

const card=(title,body)=>
 `<section class="card"><h2>${title}</h2>${body}</section>`;

const tile=(name,value)=>
 `<div class="tile"><div class="muted">${name}</div>
 <div class="value">${value}</div></div>`;

const btn=(text,action,style="")=>
 `<button class="btn ${style}" data-action="${action}">${text}</button>`;

const row=(a,b)=>
 `<div class="row"><span>${esc(a)}</span><b>${b}</b></div>`;

const totalExpenses=()=>db.expenses.reduce(
 (s,x)=>s+Number(x.amount||0),0
);

const totalPnl=()=>db.trades.reduce(
 (s,x)=>s+Number(x.pnl||0),0
);

function home(){
 const remaining=db.tasks.filter(x=>!x.done).length;
 const last=db.reports[0];

 return card("🏛️ Командный центр",`
 <div class="grid">
 ${tile("Остаток бюджета",money(db.life-totalExpenses()))}
 ${tile("Свободный банк",money(db.bank))}
 ${tile("Задачи",remaining)}
 ${tile("Торговый результат",money(totalPnl()))}
 </div>
 <p class="muted">ORACLE LIFE · Персональная панель управления</p>
 <div class="buttons">
 ${btn("📅 Планы","go-plans")}
 ${btn("💻 DEV MEMORY","go-dev","alt")}
 </div>
 `)+card("☀️ DAILY BRIEFING",`
 <p>Сегодня: ${new Date().toLocaleDateString("ru-RU")}</p>
 <p>Невыполненных задач: <b>${remaining}</b></p>
 <p>Энергия: <b>${db.energy}/10</b></p>
 <p>Сон: <b>${db.sleep} ч</b></p>
 <p>Торговых записей сегодня:
 <b>${db.trades.filter(x=>x.date===today()).length}</b></p>
 `)+card("💻 Последняя работа",
 last?`
 <b style="color:var(--gold)">${esc(last.project||"Без названия")}</b>
 <p>${esc(last.stop||last.done||"Отчёт сохранён")}</p>
 ${btn("📋 Скопировать","copy-last")}
 `:"<p class='muted'>Отчётов пока нет.</p>");
}

function plans(){
 const shifts=[
 ["off","🏡 Выходной"],
 ["day","☀️ День 08:00–20:00"],
 ["night","🌙 Ночь 20:00–08:00"],
 ["recovery","😴 Отсыпной"]
 ];

 return card("📅 Планирование",`
 <label>Тип дня</label>
 <select id="shift">
 ${shifts.map(([v,t])=>
 `<option value="${v}" ${db.shift===v?"selected":""}>${t}</option>`
 ).join("")}
 </select>
 <label>Энергия: <b id="energyValue">${db.energy}</b>/10</label>
 <input id="energy" type="range" min="1" max="10" value="${db.energy}">
 <label>Сон, часов</label>
 <input id="sleep" type="number" min="0" max="24" value="${db.sleep}">
 <div class="buttons">${btn("Сохранить","save-wellbeing")}</div>
 `)+card("＋ Новая задача",`
 <form data-form="task">
 <label>Название</label>
 <input name="name" required>
 <label>Продолжительность, минут</label>
 <input name="duration" type="number" min="1" value="60" required>
 <button class="btn" style="margin-top:12px">Добавить</button>
 </form>
 `)+card("📋 Мои задачи",`
 ${db.tasks.length?db.tasks.map(t=>`
 <div class="row">
 <input class="check" type="checkbox"
 data-task="${t.id}" ${t.done?"checked":""}>
 <span style="flex:1;${t.done?"text-decoration:line-through":""}">
 ${esc(t.name)} <small>${t.duration} мин</small>
 </span>
 ${btn("✕","delete-task-"+t.id,"danger")}
 </div>
 `).join(""):"<p class='muted'>Пока нет задач.</p>"}
 <div class="buttons">
 ${btn("🚨 Сегодня не по плану","replan","alt")}
 </div>
 `);
}

function finance(){
 const tabs=[
 ["budget","💳 Бюджет"],
 ["bank","🏦 Банк"],
 ["history","📜 История"]
 ];

 let html=`<div class="tabs">${
 tabs.map(([id,name])=>
 `<button data-finance="${id}" class="${db.financeTab===id?"active":""}">${name}</button>`
 ).join("")
 }</div>`;

 if(db.financeTab==="bank"){
  return html+card("🏦 Свободный банк",`
  ${tile("Баланс",money(db.bank))}
  <form data-form="bank">
  <label>Сумма, ₽</label>
  <input name="amount" type="number" min="0.01" step="0.01" required>
  <div class="buttons">
  <button class="btn" name="operation" value="add">Пополнить</button>
  <button class="btn alt" name="operation" value="take">Снять</button>
  </div>
  </form>
  <p class="muted">Переводы внутри бюджета не являются доходом.</p>
  `)+card("История банка",
  db.bankHistory.slice().reverse().map(x=>
  row(x.note,money(x.amount))
  ).join("")||"История пуста");
 }

 if(db.financeTab==="history"){
  return html+card("📜 Расходы",
  db.expenses.slice().reverse().map(x=>
  row(x.name,"−"+money(x.amount))
  ).join("")||"Расходов пока нет");
 }

 const spent=totalExpenses();
 const todaySpent=db.expenses.filter(
 x=>x.date===today()
 ).reduce((a,x)=>a+Number(x.amount),0);

 return html+card("💰 Деньги на жизнь",`
 <form data-form="budget">
 <label>Выделено на жизнь, ₽</label>
 <input name="life" type="number" min="0" value="${db.life}" required>
 <label>Дневной лимит, ₽</label>
 <input name="limit" type="number" min="0" value="${db.limit}" required>
 <button class="btn" style="margin-top:12px">Сохранить</button>
 </form>
 <div class="grid" style="margin-top:12px">
 ${tile("Осталось",money(db.life-spent))}
 ${tile("Потрачено",money(spent))}
 </div>
 `)+card("💳 Мой бюджет",`
 <div class="grid">
 ${tile("Лимит сегодня",money(db.limit))}
 ${tile("Сегодня потрачено",money(todaySpent))}
 </div>
 `)+card("📅 Финансовый календарь",calendar())+
 card("＋ Записать расход",`
 <form data-form="expense">
 <label>Название</label>
 <input name="name" required>
 <label>Сумма, ₽</label>
 <input name="amount" type="number" min="0.01" step="0.01" required>
 <button class="btn" style="margin-top:12px">Сохранить расход</button>
 </form>
 `)+card("Последние расходы",
 db.expenses.slice(-10).reverse().map(x=>
 row(x.name,"−"+money(x.amount))
 ).join("")||"Пока нет расходов");
}

function calendar(){
 const d=new Date();
 const year=d.getFullYear();
 const month=d.getMonth();
 const days=new Date(year,month+1,0).getDate();
 const offset=(new Date(year,month,1).getDay()+6)%7;

 let cells=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(
 x=>`<div class="muted">${x}</div>`
 );

 for(let i=0;i<offset;i++)cells.push("<div></div>");

 for(let day=1;day<=days;day++){
  const date=year+"-"+String(month+1).padStart(2,"0")+"-"+
  String(day).padStart(2,"0");
  const sum=db.expenses.filter(x=>x.date===date)
  .reduce((a,x)=>a+Number(x.amount),0);

  cells.push(`<div class="tile" style="padding:6px;text-align:center">
  ${day}<div class="muted">${sum?Math.round(sum)+" ₽":"·"}</div>
  </div>`);
 }

 return `<div class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));gap:3px">
 ${cells.join("")}</div>`;
}

function trade(){
 const todayTrades=db.trades.filter(x=>x.date===today());
 const wins=todayTrades.filter(x=>x.result==="win").length;
 const losses=todayTrades.filter(x=>x.result==="loss").length;
 let streak=0;

 for(let i=todayTrades.length-1;i>=0;i--){
  if(todayTrades[i].result==="loss")streak++;
  else break;
 }

 const stop=todayTrades.length>=5||streak>=2;

 return card("📈 ORACLE TRADE",`
 <div class="grid">
 ${tile("Капитал",money(db.capital+totalPnl()))}
 ${tile("Результат",money(totalPnl()))}
 ${tile("Сделок сегодня",todayTrades.length+" / 5")}
 ${tile("WIN / LOSS",wins+" / "+losses)}
 </div>
 <label>Начальный капитал, ₽</label>
 <input id="capital" type="number" min="0" value="${db.capital}">
 <div class="buttons">${btn("Сохранить капитал","save-capital")}</div>
 ${stop?`<div class="notice" style="margin-top:12px">
 ⚠️ Достигнут лимит торговой дисциплины.
 </div>`:""}
 <p class="muted">Правила: риск 1%, максимум 5 сделок,
 стоп после двух убытков подряд.</p>
 `)+card("＋ Записать сделку",`
 <form data-form="trade">
 <label>Актив</label>
 <select name="asset">
 <option>EUR/USD</option>
 <option>GBP/USD</option>
 <option>USD/JPY</option>
 <option>BTC/USDT</option>
 </select>
 <label>Направление</label>
 <select name="direction">
 <option>CALL</option><option>PUT</option>
 </select>
 <label>Таймфрейм</label>
 <select name="tf">
 <option>M1</option><option>M5</option>
 <option>M15</option><option>H1</option>
 </select>
 <label>Ставка, ₽</label>
 <input name="stake" type="number" min="0.01" step="0.01" value="100" required>
 <label>Выплата, %</label>
 <input name="payout" type="number" min="0" max="100" value="85" required>
 <div class="buttons">
 <button class="btn" name="result" value="win">✓ WIN</button>
 <button class="btn danger" name="result" value="loss">✕ LOSS</button>
 </div>
 </form>
 `)+card("📜 История сделок",
 db.trades.slice().reverse().map(x=>
 row(x.asset+" · "+x.tf+" · "+x.direction,
 `<span class="${x.pnl>=0?"green":"red"}">${money(x.pnl)}</span>`)
 ).join("")||"Сделок пока нет");
}

const HEADINGS={
 "ПРОЕКТ":"project",
 "ПОМОЩНИК":"agent",
 "ДАТА":"date",
 "СДЕЛАНО":"done",
 "ГДЕ ОСТАНОВИЛИСЬ":"stop",
 "ПРОБЛЕМЫ":"issues",
 "СЛЕДУЮЩИЕ ЗАДАЧИ":"next",
 "ИЗМЕНЁННЫЕ ФАЙЛЫ":"files",
 "GIT":"git",
 "ИСТОРИЯ СДЕЛОК":"trades",
 "ИТОГИ ТОРГОВОГО ДНЯ":"summary",
 "ИТОГ":"conclusion"
};

function parseReport(raw){
 const result={};
 let section="";

 for(const line of raw.split(/\r?\n/)){
  const match=line.match(/^([^:]{2,60}):\s*(.*)$/);
  const heading=match?.[1]?.trim().toUpperCase();

  if(heading&&HEADINGS[heading]){
   section=HEADINGS[heading];
   result[section]=match[2]||"";
  }else if(section){
   result[section]+="\n"+line;
  }
 }

 return result;
}

function reportText(r){
 return [
 "ORACLE LIFE · ПЕРЕДАЧА СЕССИИ",
 "ПРОЕКТ: "+(r.project||"Не указано"),
 "ПОМОЩНИК: "+(r.agent||"Не указано"),
 "ДАТА: "+(r.date||"Не указано"),
 "",
 "СДЕЛАНО:\n"+(r.done||"Не указано"),
 "ГДЕ ОСТАНОВИЛИСЬ:\n"+(r.stop||"Не указано"),
 "ПРОБЛЕМЫ:\n"+(r.issues||"Не указано"),
 "СЛЕДУЮЩИЕ ЗАДАЧИ:\n"+(r.next||"Не указано"),
 "ИЗМЕНЁННЫЕ ФАЙЛЫ:\n"+(r.files||"Не указано"),
 "GIT:\n"+(r.git||"Не указано"),
 "",
 "ПОЛНЫЙ ОТЧЁТ:\n"+(r.source||"")
 ].join("\n\n");
}

function dev(){
 const tabs=[
 ["import","📥 Импорт"],
 ["fields","📝 Разбор"],
 ["latest","📌 Последняя"],
 ["archive","🗂️ Архив"]
 ];

 let html=`<div class="tabs">${
 tabs.map(([id,name])=>
 `<button data-dev="${id}" class="${db.devTab===id?"active":""}">
 ${name}</button>`).join("")
 }</div>`;

 if(db.devTab==="import"){
  return html+card("💻 DEV MEMORY · Импорт",`
  <p class="muted">Вставь отчёт Codex, OpenCode
  или отчёт торгового дня.</p>
  <textarea id="rawReport" placeholder="Вставь полный отчёт...">${esc(db.raw)}</textarea>
  <div class="buttons">
  ${btn("🔍 Разобрать","parse")}
  ${btn("🧹 Очистить поле","clear-raw","alt")}
  </div>
  `);
 }

 if(db.devTab==="fields"){
  const r=db.draft||{};
  const fields=[
   ["project","Проект"],
   ["agent","Помощник"],
   ["date","Дата"],
   ["done","Сделано"],
   ["stop","Где остановились"],
   ["issues","Проблемы"],
   ["next","Следующие задачи"],
   ["files","Изменённые файлы"],
   ["git","Git"],
   ["trades","История сделок"],
   ["summary","Итоги торгового дня"]
  ];

  return html+card("📝 Проверь поля",`
  <form data-form="report">
  ${fields.map(([id,name])=>`
  <label>${name}</label>
  <textarea name="${id}" rows="2">${esc(r[id]||"")}</textarea>
  `).join("")}
  <button class="btn" style="margin-top:12px">💾 Сохранить отчёт</button>
  </form>
  <div class="buttons">${btn("Сбросить разбор","clear-draft","alt")}</div>
  `);
 }

 if(db.devTab==="latest"){
  const r=db.reports[0];
  return html+card("📌 Последняя работа",
  r?`
  <h3>${esc(r.project||"Без названия")}</h3>
  <p class="muted">${esc(r.date||"Дата не указана")}</p>
  ${["done","stop","issues","next"].map(k=>`
  <div class="tile" style="margin-bottom:8px">
  <b>${({done:"Сделано",stop:"Остановились",
  issues:"Проблемы",next:"Дальше"})[k]}</b>
  <pre>${esc(r[k]||"Не указано")}</pre>
  </div>`).join("")}
  <div class="buttons">
  ${btn("📋 Скопировать","copy-last")}
  ${btn("🗑️ Удалить","delete-last","danger")}
  </div>
  <details><summary>Оригинальный отчёт</summary>
  <pre>${esc(r.source||"Не указан")}</pre></details>
  `:"<p>Нет сохранённых отчётов.</p>");
 }

 return html+card("🗂️ Архив",db.reports.length?
 db.reports.map((r,i)=>`
 <div class="tile" style="margin-bottom:10px">
 <b style="color:var(--gold)">${esc(r.project||"Без названия")}</b>
 <p class="muted">${esc(r.date||"")}</p>
 <div class="buttons">
 ${btn("Открыть","open-report-"+i,"alt")}
 ${btn("Удалить","delete-report-"+i,"danger")}
 </div>
 </div>
 `).join(""):"Архив пуст");
}

function more(){
 const sections=[
 ["dev","💻 DEV"],
 ["ideas","💡 Идеи"],
 ["notes","📔 Дневник"],
 ["settings","⚙️ Настройки"]
 ];

 let html=`<div class="tabs">${
 sections.map(([id,name])=>
 `<button data-more="${id}" class="${db.more===id?"active":""}">${name}</button>`
 ).join("")
 }</div>`;

 if(db.more==="dev")return html+dev();

 if(db.more==="ideas"){
  return html+card("💡 ORACLE INBOX",`
  <form data-form="idea">
  <textarea name="text" placeholder="Новая идея..." required></textarea>
  <button class="btn">Сохранить идею</button>
  </form>
  `)+card("Мои идеи",
  db.ideas.map(x=>row(x,"")).join("")||"Идей пока нет");
 }

 if(db.more==="notes"){
  return html+card("📔 Дневник",`
  <form data-form="note">
  <textarea name="text" placeholder="Что произошло сегодня?" required></textarea>
  <button class="btn">Сохранить</button>
  </form>
  `)+card("Записи",
  db.notes.slice().reverse().map(x=>
  row(x.date,esc(x.text))
  ).join("")||"Записей пока нет");
 }

 return html+card("⚙️ Данные и резервные копии",`
 <p class="muted">Все данные хранятся локально
 в браузере этого устройства.</p>
 <div class="buttons">
 ${btn("📤 Экспорт","export")}
 ${btn("📥 Импорт","import","alt")}
 </div>
 <div class="buttons">
 ${btn("🗑️ Сбросить данные","reset","danger")}
 </div>
 <p class="muted">Перед очисткой Telegram или браузера
 обязательно сохрани резервную копию.</p>
 `);
}

function render(){
 const pages={
  home,plans,finance,trade,more
 };

 if(!pages[db.tab])db.tab="home";

 el("nav").innerHTML=[
  ["home","🏛️","Главная"],
  ["plans","📅","Планы"],
  ["finance","💳","Финансы"],
  ["trade","📈","Трейдинг"],
  ["more","⚙️","Ещё"]
 ].map(([id,icon,name])=>`
 <button data-tab="${id}" class="${db.tab===id?"active":""}">
 <b>${icon}</b>${name}</button>
 `).join("");

 try{
  el("main").innerHTML=pages[db.tab]();
 }catch(e){
  console.error(e);
  el("main").textContent="Ошибка отображения: "+e.message;
 }
 save();
}

function copy(text){
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(text).then(
   ()=>alert("Скопировано!"),
   ()=>fallbackCopy(text)
  );
 }else fallbackCopy(text);
}

function fallbackCopy(text){
 const area=document.createElement("textarea");
 area.value=text;
 document.body.appendChild(area);
 area.select();
 const ok=document.execCommand("copy");
 area.remove();
 if(ok)alert("Скопировано!");
 else prompt("Скопируй текст:",text);
}

document.addEventListener("click",e=>{
 const b=e.target.closest(
  "[data-tab],[data-more],[data-finance],[data-dev],[data-action]"
 );
 if(!b)return;

 if(b.dataset.tab){
  db.tab=b.dataset.tab;
  render();return;
 }
 if(b.dataset.more){
  db.more=b.dataset.more;
  render();return;
 }
 if(b.dataset.finance){
  db.financeTab=b.dataset.finance;
  render();return;
 }
 if(b.dataset.dev){
  db.devTab=b.dataset.dev;
  render();return;
 }

 const a=b.dataset.action;
 if(!a)return;

 if(a.startsWith("go-")){
  const dest=a.slice(3);
  db.tab=dest==="dev"?"more":dest;
  if(dest==="dev")db.more="dev";
  render();return;
 }

 if(a==="save-wellbeing"){
  db.energy=Number(el("energy").value);
  db.sleep=Number(el("sleep").value);
 }

 if(a==="save-capital"){
  db.capital=Number(el("capital").value);
 }

 if(a==="replan"){
  if(confirm("Перенести невыполненные дела на потом?")){
   db.tasks.forEach(t=>{
    if(!t.done)t.deferred=true;
   });
  }
 }

 if(a.startsWith("delete-task-")){
  const id=a.slice(12);
  if(confirm("Удалить задачу?"))
   db.tasks=db.tasks.filter(t=>String(t.id)!==id);
 }

 if(a==="clear-raw"){
  db.raw="";
 }

 if(a==="parse"){
  db.raw=el("rawReport").value;
  if(!db.raw.trim()){
   alert("Вставь отчёт.");return;
  }
  db.draft=parseReport(db.raw);
  db.devTab="fields";
 }

 if(a==="clear-draft"){
  db.draft=null;
  db.devTab="import";
 }

 if(a==="copy-last"){
  if(db.reports[0])copy(reportText(db.reports[0]));
 }

 if(a==="delete-last"){
  if(confirm("Удалить последнюю сессию?"))
   db.reports.shift();
 }

 if(a.startsWith("open-report-")){
  const i=Number(a.slice(12));
  const r=db.reports[i];
  if(r){
   db.reports.splice(i,1);
   db.reports.unshift(r);
   db.devTab="latest";
  }
 }

 if(a.startsWith("delete-report-")){
  const i=Number(a.slice(14));
  if(confirm("Удалить отчёт?"))
   db.reports.splice(i,1);
 }

 if(a==="export"){
  const blob=new Blob(
   [JSON.stringify({app:"ORACLE LIFE",version:7,data:db},null,2)],
   {type:"application/json"}
  );
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download="oracle-life-backup-"+today()+".json";
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
 }

 if(a==="import")el("backupFile").click();

 if(a==="reset"){
  if(confirm("Удалить все данные ORACLE LIFE?")){
   db=defaults();
  }
 }

 render();
});

document.addEventListener("change",e=>{
 if(e.target.id==="shift"){
  db.shift=e.target.value;
  save();
 }
 if(e.target.dataset.task){
  const t=db.tasks.find(x=>String(x.id)===e.target.dataset.task);
  if(t)t.done=e.target.checked;
  save();
 }
});

document.addEventListener("input",e=>{
 if(e.target.id==="rawReport"){
  db.raw=e.target.value;
  save();
 }
});

document.addEventListener("submit",e=>{
 const form=e.target.closest("form[data-form]");
 if(!form)return;
 e.preventDefault();

 const data=Object.fromEntries(new FormData(form));
 const type=form.dataset.form;

 if(type==="task"){
  db.tasks.push({
   id:Date.now(),
   name:data.name.trim(),
   duration:Number(data.duration),
   done:false,
   deferred:false
  });
 }

 if(type==="budget"){
  db.life=Number(data.life);
  db.limit=Number(data.limit);
 }

 if(type==="expense"){
  db.expenses.push({
   id:Date.now(),
   name:data.name.trim(),
   amount:Number(data.amount),
   date:today()
  });
 }

 if(type==="bank"){
  const amount=Number(data.amount);
  const take=e.submitter?.value==="take";
  if(take&&amount>db.bank){
   alert("Недостаточно средств.");return;
  }
  db.bank+=take?-amount:amount;
  db.bankHistory.push({
   amount:take?-amount:amount,
   note:take?"Снятие":"Пополнение",
   date:today()
  });
 }

 if(type==="trade"){
  const stake=Number(data.stake);
  const payout=Number(data.payout);
  const result=e.submitter?.value==="loss"?"loss":"win";
  const current=db.capital+totalPnl();
  const todayTrades=db.trades.filter(x=>x.date===today());

  let streak=0;
  for(let i=todayTrades.length-1;i>=0;i--){
   if(todayTrades[i].result==="loss")streak++;
   else break;
  }

  if(stake>current*0.01){
   if(!confirm("Ставка превышает риск 1%. Всё равно записать?"))
    return;
  }

  if(todayTrades.length>=5||streak>=2){
   if(!confirm("Нарушение торгового лимита. Записать сделку?"))
    return;
  }

  const pnl=result==="win"?
   Math.round(stake*payout)/100:
   -stake;

  db.trades.push({
   id:Date.now(),
   asset:data.asset,
   direction:data.direction,
   tf:data.tf,
   stake,payout,result,pnl,
   date:today()
  });
 }

 if(type==="report"){
  db.reports.unshift({
   ...data,
   id:Date.now(),
   source:db.raw,
   date:data.date||today()
  });
  db.devTab="latest";
 }

 if(type==="idea"){
  db.ideas.push(data.text.trim());
 }

 if(type==="note"){
  db.notes.push({date:today(),text:data.text.trim()});
 }

 render();
});

el("backupFile").addEventListener("change",async e=>{
 const file=e.target.files?.[0];
 if(!file)return;

 try{
  const obj=JSON.parse(await file.text());
  if(obj.app!=="ORACLE LIFE"||!obj.data)
   throw new Error("Неверный формат");

  if(confirm("Заменить текущие данные резервной копией?")){
   db={...defaults(),...obj.data};
   render();
  }
 }catch(error){
  alert("Ошибка импорта: "+error.message);
 }
 e.target.value="";
});

window.addEventListener("error",e=>{
 console.error("ORACLE LIFE:",e.error||e.message);
});

render();
</script>
</body>
</html>
