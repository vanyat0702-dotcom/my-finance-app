
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071810">
<title>ORACLE LIFE 7.4</title>
<style>
:root{
 --bg:#061610;
 --surface:#102b20;
 --surface2:#193b2c;
 --gold:#e8c77e;
 --green:#2ddd9e;
 --text:#edf5ee;
 --muted:#abc4b4;
 --line:#355b47;
 --red:#ff9da4;
 --blue:#99c9ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--bg);color:var(--text);
 font:14px system-ui,-apple-system,Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
header{
 padding:22px 16px 19px;
 background:linear-gradient(125deg,#164331,#071810);
 border-bottom:1px solid var(--line)
}
.brand{
 color:var(--gold);font:700 29px Georgia,serif;
 letter-spacing:1px
}
.brand span{color:var(--green)}
.motto{
 color:var(--gold);font-size:10px;
 letter-spacing:1px;margin-top:9px
}
.header-sub{color:var(--muted);margin-top:10px;font-size:12px}
main{max-width:780px;margin:auto;padding:15px 13px 110px}
.card{
 background:var(--surface);border:1px solid var(--line);
 border-radius:17px;padding:16px;margin-bottom:14px
}
h2{font-size:19px;color:var(--gold);margin:0 0 14px}
h3{font-size:15px;color:var(--gold);margin:15px 0 10px}
p{line-height:1.55}
.muted{color:var(--muted);font-size:12px}
.small{font-size:11px}
.gold{color:var(--gold)}
.green{color:var(--green)}
.red{color:var(--red)}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px
}
.tile{
 background:var(--surface2);border-radius:11px;
 padding:12px;min-width:0
}
.tile .value{
 font-size:19px;font-weight:800;color:var(--gold);
 overflow-wrap:anywhere;margin-top:6px
}
label{display:block;color:var(--gold);margin:12px 0 5px}
input,select,textarea{
 display:block;width:100%;background:#071e16;
 border:1px solid #52705d;border-radius:9px;
 color:white;padding:11px;outline:none
}
input:focus,select:focus,textarea:focus{
 border-color:var(--green)
}
textarea{min-height:90px;resize:vertical}
.btn{
 border:0;border-radius:10px;padding:11px 12px;
 background:var(--green);color:#06231a;
 font-weight:800
}
.btn.alt{background:#28533e;color:white}
.btn.danger{background:#773b42;color:white}
.btn.goldbtn{background:var(--gold);color:#201b0d}
.buttons{
 display:flex;gap:8px;flex-wrap:wrap;margin-top:12px
}
.buttons .btn{flex:1;min-width:105px}
.row{
 display:flex;justify-content:space-between;
 align-items:center;gap:9px;
 padding:11px 0;border-bottom:1px solid var(--line)
}
.row>span{min-width:0;overflow-wrap:anywhere}
.row b{color:var(--gold)}
.row small{display:block;color:var(--muted);margin-top:4px}
.nav{
 position:fixed;bottom:0;left:0;right:0;z-index:20;
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
 background:#08241a;border-top:1px solid var(--line);
 padding:6px 3px calc(6px + env(safe-area-inset-bottom))
}
.nav button{
 background:transparent;border:0;color:#c6d8cb;
 border-radius:9px;padding:8px 1px;font-size:11px
}
.nav button.active{background:#21523c;color:var(--gold)}
.nav b{display:block;font-size:20px;margin-bottom:3px}
.tabs{
 display:flex;gap:7px;overflow-x:auto;padding-bottom:11px
}
.tabs button{
 white-space:nowrap;background:#1b3c2e;
 color:white;border:1px solid var(--line);
 border-radius:9px;padding:10px
}
.tabs button.active{border-color:var(--gold);color:var(--gold)}
.notice{
 background:#452c2d;color:#ffd5d5;
 border-radius:10px;padding:12px;margin:10px 0
}
.success{
 background:#174c36;color:#b7ffdb;
 border-radius:10px;padding:12px;margin:10px 0
}
.info{
 background:#173e39;color:#c9edeb;
 border-radius:10px;padding:12px;margin:10px 0
}
.progress{
 height:12px;background:#061b14;
 border-radius:20px;overflow:hidden;margin:10px 0
}
.progress>div{
 height:100%;background:linear-gradient(90deg,#1a9e72,#e8c77e);
 border-radius:20px;transition:width .2s
}
.schedule{
 background:var(--surface2);border-left:3px solid var(--green);
 border-radius:0 11px 11px 0;
 padding:12px;margin:9px 0
}
.schedule.required{border-color:var(--gold)}
.schedule.done{opacity:.65}
.schedule.current{outline:1px solid var(--green)}
.schedule .time{color:var(--gold);font-weight:800}
.schedule .name{font-weight:750;margin:6px 0}
.chip{
 display:inline-block;border:1px solid var(--line);
 border-radius:20px;padding:4px 8px;
 font-size:11px;color:var(--muted);margin:3px
}
.checkline{
 display:flex;align-items:center;gap:9px;
 color:var(--text);margin-top:12px
}
.checkline input{
 width:20px;height:20px;accent-color:var(--green);
 flex:none
}
.timeline{
 border-left:2px solid var(--line);
 padding-left:14px;margin-left:7px
}
.timeline .schedule{margin:12px 0}
.timer{
 font-size:48px;font-weight:800;color:var(--gold);
 text-align:center;font-variant-numeric:tabular-nums;
 margin:16px 0
}
.calendar{
 display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
 gap:4px
}
.day{
 background:var(--surface2);border-radius:8px;
 text-align:center;padding:8px 2px
}
.day small{
 display:block;color:var(--muted);font-size:9px;
 overflow-wrap:anywhere
}
pre{
 white-space:pre-wrap;overflow-wrap:anywhere;
 background:#071e16;padding:12px;border-radius:9px
}
details{margin-top:12px}
summary{color:var(--gold);cursor:pointer}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.empty{color:var(--muted);padding:12px 0}
@media(max-width:380px){
 .card{padding:12px}
 .tile .value{font-size:16px}
 .timer{font-size:40px}
}

<body>

<header>
 <div class="brand">◈ ORACLE <span>LIFE</span></div>
 <div class="motto">
 ПОРЯДОК В НАСТОЯЩЕМ. ВЛАСТЬ НАД БУДУЩИМ.
 </div>
 <div class="header-sub">
 MR. ARCANUM · LIFE COMMAND CENTER · 7.4
 </div>
</header>

<main id="main"></main>
<nav class="nav" id="nav"></nav>
<input type="file" id="backupFile" accept=".json" hidden>

<script>
"use strict";

/* ======================================
   ORACLE LIFE 7.4
   LIFE COMMAND CENTER
   ====================================== */

const STORAGE_KEY="oracle-life-v71-clean";
const APP_VERSION=74;
const $=id=>document.getElementById(id);

function uid(){
 return Date.now()+"-"+Math.random().toString(36).slice(2,9);
}

function localDate(date=new Date()){
 return date.getFullYear()+"-"+
 String(date.getMonth()+1).padStart(2,"0")+"-"+
 String(date.getDate()).padStart(2,"0");
}

function validDate(value){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value||""))return false;
 const d=new Date(value+"T12:00:00Z");
 return !isNaN(d.getTime())&&d.toISOString().slice(0,10)===value;
}

function dayNum(date){
 return Math.floor(Date.parse(date+"T12:00:00Z")/86400000);
}

function fromDayNum(n){
 return new Date(n*86400000).toISOString().slice(0,10);
}

function addDays(date,n){
 return fromDayNum(dayNum(date)+n);
}

function today(){
 return localDate();
}

function nowMinutes(){
 const d=new Date();
 return d.getHours()*60+d.getMinutes();
}

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}

function toCents(value){
 return Math.round(Number(value||0)*100);
}

function fromCents(value){
 return value/100;
}

function roundMoney(value){
 return fromCents(toCents(value));
}

function money(value){
 return Number(value||0).toLocaleString("ru-RU",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 })+" ₽";
}

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function card(title,html){
 return `<section class="card"><h2>${title}</h2>${html}</section>`;
}

function tile(name,value){
 return `<div class="tile">
 <div class="muted">${name}</div>
 <div class="value">${value}</div>
 </div>`;
}

function btn(name,action,kind=""){
 return `<button type="button" class="btn ${kind}"
 data-action="${esc(action)}">${name}</button>`;
}

function row(name,value){
 return `<div class="row"><span>${esc(name)}</span><b>${value}</b></div>`;
}

function tabs(items,selected,attr){
 return `<div class="tabs">${items.map(([id,name])=>`
 <button data-${attr}="${id}"
 class="${id===selected?"active":""}">${name}</button>
 `).join("")}</div>`;
}

function options(items,selected){
 return items.map(([id,name])=>`
 <option value="${esc(id)}"
 ${id===selected?"selected":""}>${esc(name)}</option>
 `).join("");
}

function progress(done,total){
 const percent=total?clamp(Math.round(done/total*100),0,100):0;
 return `<div class="progress">
 <div style="width:${percent}%"></div>
 </div><div class="muted">${percent}% выполнено</div>`;
}

const SHIFTS=[
 ["off","🏡 Выходной"],
 ["day","☀️ День 08:00–20:00"],
 ["night","🌙 Ночь 20:00–08:00"],
 ["recovery","😴 Отсыпной"]
];

const PLACES=[
 ["home","🏠 Дома"],
 ["work","🏭 На работе"],
 ["road","🚗 В дороге"],
 ["outside","🌍 Вне дома"]
];

const PRIORITIES=[
 ["high","🔴 Высокий"],
 ["normal","🟡 Обычный"],
 ["low","🟢 Низкий"]
];

function defaults(){
 return {
  version:74,
  tab:"home",
  more:"dev",
  financeTab:"budget",
  devTab:"import",

  salary:0,
  life:0,
  savings:0,
  bank:0,
  capital:10000,
  dailyLimit:0,
  limitMode:"auto",
  reservedBills:0,
  nextPayday:"",
  periodStart:"",
  periodId:"",
  lastClosedDay:"",

  salaryHistory:[],
  expenses:[],
  bankHistory:[],
  tasks:[],
  trades:[],
  reports:[],
  ideas:[],
  notes:[],

  raw:"",
  draft:null,

  shift:"off",
  location:"home",
  energy:7,
  sleep:8,
  sleepTime:"23:00",

  habits:[],
  dayPlans:{},
  dayHistory:{},
  dailyReviews:{},
  financialGoals:[],
  focusSessions:[],

  plannerSettings:{
   breakMinutes:15,
   maxFocusMinutes:180
  },

  plannerMessage:"",
  lastActiveDate:"",
  lastWelcomeDate:"",
  dailyResetCount:0,

  focus:{
   active:false,
   paused:false,
   startedAt:null,
   elapsedBeforePause:0,
   targetMinutes:60,
   taskName:"",
   taskId:null
  }
 };
}

let db;

try{
 const stored=JSON.parse(
  localStorage.getItem(STORAGE_KEY)||"{}"
 );
 db={...defaults(),...stored};
}catch(error){
 console.error("Ошибка чтения данных:",error);
 db=defaults();
}

const ARRAY_FIELDS=[
 "salaryHistory","expenses","bankHistory",
 "tasks","trades","reports","ideas","notes",
 "habits","financialGoals","focusSessions"
];

function normalize(){
 for(const name of ARRAY_FIELDS){
  if(!Array.isArray(db[name]))db[name]=[];
 }

 for(const name of ["dayPlans","dayHistory","dailyReviews"]){
  if(!db[name]||typeof db[name]!=="object"||
   Array.isArray(db[name]))db[name]={};
 }

 if(!db.plannerSettings||
  typeof db.plannerSettings!=="object"){
  db.plannerSettings=defaults().plannerSettings;
 }

 if(!db.focus||typeof db.focus!=="object"){
  db.focus=defaults().focus;
 }

 if(!["auto","manual"].includes(db.limitMode)){
  db.limitMode="auto";
 }

 if(!validDate(db.periodStart)){
  db.periodStart=today();
 }

 if(!db.periodId){
  db.periodId="legacy:"+db.periodStart;
 }

 if(!validDate(db.lastClosedDay)){
  db.lastClosedDay=addDays(today(),-1);
 }

 if(!validDate(db.lastActiveDate)){
  db.lastActiveDate=today();
 }

 db.energy=clamp(Number(db.energy)||7,1,10);
 db.sleep=clamp(Number(db.sleep)||0,0,24);

 if(!Number.isFinite(Number(db.bank)))db.bank=0;
 if(!Number.isFinite(Number(db.life)))db.life=0;
 if(!Number.isFinite(Number(db.reservedBills))){
  db.reservedBills=0;
 }

 db.version=74;
}

function save(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  return true;
 }catch(error){
  console.error(error);
  alert(
   "Не удалось сохранить данные. "+
   "Возможно, память устройства заполнена."
  );
  return false;
 }
}

/* ======================================
   DAILY RESET
   ====================================== */

function snapshotDay(date){
 const plan=db.dayPlans[date];

 if(!plan)return;

 const items=plan.items||[];
 const completed=items.filter(x=>x.done);

 db.dayHistory[date]={
  date,
  total:items.length,
  completed:completed.length,
  incomplete:items.length-completed.length,
  deferred:(plan.deferred||[]).length,
  completedMinutes:completed.reduce(
   (sum,x)=>sum+Number(x.duration||0),0
  ),
  shift:plan.shift,
  energy:plan.energy,
  sleep:plan.sleep
 };
}

function dailyReset(){
 const current=today();
 const previous=db.lastActiveDate;

 if(previous===current)return false;

 if(validDate(previous)&&previous<current){
  const days=dayNum(current)-dayNum(previous);

  for(let i=0;i<Math.min(days,365);i++){
   const date=addDays(previous,i);
   snapshotDay(date);
  }

  db.dailyResetCount+=1;
 }

 db.lastActiveDate=current;
 db.plannerMessage=
  "☀️ Новый день! Вчерашние результаты сохранены. "+
  "Сегодня можно построить новое расписание.";

 save();
 return true;
}

/* ======================================
   ФИНАНСЫ
   ====================================== */

function periodExpenses(){
 return db.expenses.filter(x=>
  (!db.periodStart||x.date>=db.periodStart)&&
  (!validDate(db.nextPayday)||x.date<db.nextPayday)
 );
}

function periodTransfers(){
 return db.bankHistory.filter(x=>
  x.type==="AUTO_SAVINGS"&&
  x.periodId===db.periodId
 );
}

function sumExpenseCents(until=null){
 return periodExpenses()
 .filter(x=>!until||x.date<=until)
 .reduce((sum,x)=>sum+toCents(x.amount),0);
}

function sumTransferCents(until=null){
 return periodTransfers()
 .filter(x=>!until||x.date<=until)
 .reduce((sum,x)=>sum+toCents(x.amount),0);
}

function budgetAvailable(){
 return fromCents(
  toCents(db.life)-
  sumExpenseCents()-
  sumTransferCents()-
  toCents(db.reservedBills)
 );
}

function financeStats(){
 const current=today();

 const valid=validDate(db.nextPayday)&&
  db.nextPayday>current;

 const days=valid?
  dayNum(db.nextPayday)-dayNum(current):0;

 const spentToday=periodExpenses()
  .filter(x=>x.date===current)
  .reduce((sum,x)=>sum+toCents(x.amount),0);

 const balance=toCents(db.life)-
  sumExpenseCents()-
  sumTransferCents()-
  toCents(db.reservedBills);

 const opening=balance+spentToday;

 const limit=valid?
  (db.limitMode==="manual"?
   Math.max(0,toCents(db.dailyLimit)):
   Math.max(0,Math.floor(opening/days))):0;

 return {
  valid,days,spentToday,limit,balance,
  left:Math.max(0,Math.min(balance,limit-spentToday)),
  over:Math.max(0,spentToday-limit)
 };
}

function closeFinanceDays(){
 if(!validDate(db.periodStart)||
  !validDate(db.nextPayday)||
  db.nextPayday<=db.periodStart)return;

 const first=Math.max(
  dayNum(db.periodStart),
  dayNum(db.lastClosedDay)+1
 );

 const last=Math.min(
  dayNum(today())-1,
  dayNum(db.nextPayday)-1
 );

 if(last<first||last-first>3650)return;

 for(let n=first;n<=last;n++){
  const date=fromDayNum(n);

  const spentBefore=periodExpenses()
   .filter(x=>x.date<date)
   .reduce((sum,x)=>sum+toCents(x.amount),0);

  const spentToday=periodExpenses()
   .filter(x=>x.date===date)
   .reduce((sum,x)=>sum+toCents(x.amount),0);

  const savedBefore=periodTransfers()
   .filter(x=>x.date<date)
   .reduce((sum,x)=>sum+toCents(x.amount),0);

  const opening=toCents(db.life)-
   toCents(db.reservedBills)-
   spentBefore-savedBefore;

  const daysLeft=dayNum(db.nextPayday)-n;

  const limit=db.limitMode==="manual"?
   Math.max(0,toCents(db.dailyLimit)):
   Math.max(0,Math.floor(opening/daysLeft));

  const transfer=Math.max(
   0,Math.min(opening-spentToday,limit-spentToday)
  );

  const already=periodTransfers()
   .some(x=>x.date===date);

  if(transfer>0&&!already){
   db.bankHistory.push({
    id:"auto:"+db.periodId+":"+date,
    date,
    amount:fromCents(transfer),
    type:"AUTO_SAVINGS",
    note:"Остаток дневного лимита",
    periodId:db.periodId
   });

   db.bank=fromCents(toCents(db.bank)+transfer);
  }

  db.lastClosedDay=date;
 }

 save();
}

function startPeriod(data){
 db.salary=roundMoney(data.salary);
 db.life=roundMoney(data.life);
 db.savings=roundMoney(data.savings);
 db.bank=roundMoney(data.bank);

 db.periodStart=data.date;
 db.nextPayday=data.nextPayday;
 db.periodId=uid();
 db.lastClosedDay=addDays(data.date,-1);
 db.reservedBills=0;

 db.salaryHistory.push({
  id:uid(),
  date:data.date,
  period:data.period,
  salary:db.salary,
  life:db.life,
  savings:db.savings,
  bank:db.bank,
  periodId:db.periodId
 });
}

/* ======================================
   ПЛАНИРОВЩИК
   ====================================== */

function minutes(time){
 const p=String(time||"00:00").split(":");
 return Number(p[0])*60+Number(p[1]);
}

function clock(m){
 const v=((Math.floor(m)%1440)+1440)%1440;
 return String(Math.floor(v/60)).padStart(2,"0")+":"+
 String(v%60).padStart(2,"0");
}

function sleepBusy(){
 const duration=clamp(
  Math.round(Number(db.sleep||0)*60),0,1440
 );

 if(duration===0)return [];
 if(duration===1440)return [[0,1440]];

 const start=minutes(db.sleepTime||"23:00");
 const end=start+duration;

 return end<=1440?
  [[start,end]]:
  [[start,1440],[0,end-1440]];
}

function occupied(){
 const blocks=[...sleepBusy()];

 if(db.shift==="day")blocks.push([480,1200]);

 if(db.shift==="night"){
  blocks.push([0,480],[1200,1440]);
 }

 if(db.shift==="recovery"){
  blocks.push([480,720]);
 }

 return blocks;
}

function freeWindows(){
 const now=nowMinutes();

 const blocks=occupied()
  .map(([a,b])=>[clamp(a,0,1440),clamp(b,0,1440)])
  .sort((a,b)=>a[0]-b[0]);

 const merged=[];

 for(const block of blocks){
  const last=merged[merged.length-1];

  if(last&&block[0]<=last[1]){
   last[1]=Math.max(last[1],block[1]);
  }else{
   merged.push([...block]);
  }
 }

 const result=[];
 let cursor=now;

 for(const [start,end] of merged){
  if(start>cursor){
   result.push([cursor,start]);
  }
  cursor=Math.max(cursor,end);
 }

 if(cursor<1440)result.push([cursor,1440]);

 return result;
}

function priorityNumber(p){
 return p==="high"?3:p==="normal"?2:1;
}

function locationAllowed(item){
 return !item.place||item.place==="any"||
 item.place===db.location;
}

function adjustedDuration(item){
 const original=clamp(Number(item.duration)||60,5,720);

 if(item.required)return original;

 const energy=Number(db.energy)||7;
 const sleep=Number(db.sleep)||0;

 let factor=1;

 if(energy<=3)factor=.45;
 else if(energy<=5)factor=.7;
 else if(energy>=9)factor=1.1;

 if(sleep<6)factor=Math.min(factor,.65);

 return clamp(
  Math.round(original*factor/5)*5,
  5,720
 );
}

function candidateTasks(){
 const date=today();

 const habits=db.habits
  .filter(x=>x.active!==false)
  .map(x=>({
   ...x,source:"habit",sourceId:x.id
  }));

 const tasks=db.tasks
  .filter(x=>!x.done&&
   (!x.scheduledDate||x.scheduledDate<=date))
  .map(x=>({
   ...x,source:"task",sourceId:x.id
  }));

 return [...habits,...tasks].sort((a,b)=>{
  if(Boolean(a.required)!==Boolean(b.required)){
   return a.required?-1:1;
  }

  return priorityNumber(b.priority)-
   priorityNumber(a.priority);
 });
}

function currentPlan(){
 return db.dayPlans[today()]||null;
}

function generatePlan(){
 const date=today();
 const previous=currentPlan();
 const completed=new Map();
 const fixed=[];

 if(previous){
  for(const item of previous.items||[]){
   if(item.done){
    completed.set(
     item.source+":"+item.sourceId,item
    );
    fixed.push({...item});
   }else if(item.start<=nowMinutes()&&
    item.end>nowMinutes()){
    fixed.push({...item});
   }
  }
 }

 const candidates=candidateTasks();
 const windows=freeWindows();

 const breakMinutes=clamp(
  Number(db.plannerSettings.breakMinutes)||15,
  0,60
 );

 const items=[...fixed];
 const deferred=[];

 for(const task of candidates){
  const key=task.source+":"+task.sourceId;

  if(completed.has(key))continue;

  if(items.some(x=>
   x.source===task.source&&
   String(x.sourceId)===String(task.sourceId)
  ))continue;

  if(!locationAllowed(task)){
   deferred.push({
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    reason:"Недоступно в текущем месте"
   });
   continue;
  }

  const duration=adjustedDuration(task);
  let placed=false;

  for(const window of windows){
   let start=window[0];

   for(const item of fixed){
    if(item.end<=start||item.start>=window[1]){
     continue;
    }

    if(item.start<start+duration&&item.end>start){
     start=item.end+breakMinutes;
    }
   }

   if(start+duration>window[1])continue;

   items.push({
    id:uid(),
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    priority:task.priority||"normal",
    start,
    end:start+duration,
    duration,
    done:false
   });

   window[0]=start+duration+breakMinutes;
   placed=true;
   break;
  }

  if(!placed){
   deferred.push({
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    reason:"Не хватает свободного времени"
   });
  }
 }

 items.sort((a,b)=>a.start-b.start);

 db.dayPlans[date]={
  date,
  createdAt:new Date().toISOString(),
  shift:db.shift,
  location:db.location,
  energy:db.energy,
  sleep:db.sleep,
  items,deferred
 };

 const requiredMissed=deferred.filter(x=>x.required).length;

 db.plannerMessage=
  "План построен: "+items.length+
  " задач. Отложено: "+deferred.length+"."+
  (requiredMissed?
   " ⚠️ Не поместилось обязательных: "+requiredMissed+".":"");

 snapshotDay(date);
 save();
}

function markDone(id,done){
 const plan=currentPlan();
 if(!plan)return;

 const item=plan.items.find(x=>String(x.id)===String(id));
 if(!item)return;

 item.done=done;

 if(item.source==="task"){
  const task=db.tasks.find(
   x=>String(x.id)===String(item.sourceId)
  );

  if(task)task.done=done;
 }

 snapshotDay(today());
 save();
}

function emergencyReplan(){
 const plan=currentPlan();

 if(!plan){
  db.plannerMessage="Сначала создай расписание.";
  return;
 }

 const unfinished=plan.items.filter(x=>!x.done);

 for(const item of unfinished){
  if(!plan.deferred.some(x=>
   x.source===item.source&&
   String(x.sourceId)===String(item.sourceId)
  )){
   plan.deferred.push({
    source:item.source,
    sourceId:item.sourceId,
    name:item.name,
    required:item.required,
    reason:"Изменение планов"
   });
  }
 }

 plan.items=plan.items.filter(x=>x.done);

 db.plannerMessage=
  "Выполненное сохранено. "+
  "Невыполненные дела ожидают перепланирования.";

 snapshotDay(today());
 save();
}

function planStats(){
 const plan=currentPlan();

 if(!plan){
  return {total:0,done:0,pending:0,deferred:0,minutes:0};
 }

 return {
  total:plan.items.length,
  done:plan.items.filter(x=>x.done).length,
  pending:plan.items.filter(x=>!x.done).length,
  deferred:plan.deferred.length,
  minutes:plan.items.filter(x=>x.done)
   .reduce((sum,x)=>sum+Number(x.duration||0),0)
 };
}

function nextTask(){
 const plan=currentPlan();
 if(!plan)return null;

 const now=nowMinutes();

 return plan.items

  .sort((a,b)=>a.start-b.start)[0]||null;
}

/* ======================================

function focusElapsed(){
 const f=db.focus;
 let seconds=Number(f.elapsedBeforePause)||0;

 if(f.active&&!f.paused&&f.startedAt){
  seconds+=Math.max(
   0,Math.floor((Date.now()-f.startedAt)/1000)
  );
 }

 return seconds;
}

function focusRemaining(){
 return Math.max(
  0,Number(db.focus.targetMinutes||60)*60-
  focusElapsed()
 );
}

function formatSeconds(value){
 const sec=Math.max(0,Math.floor(value));
 const h=Math.floor(sec/3600);
 const m=Math.floor(sec%3600/60);
 const s=sec%60;

 return (h?String(h).padStart(2,"0")+":":"")+
 String(m).padStart(2,"0")+":"+
 String(s).padStart(2,"0");
}

function startFocus(){
 const duration=Number($("focusDuration")?.value||60);
 const name=$("focusName")?.value.trim()||"Концентрация";

 if(!Number.isFinite(duration)||
  duration<1||duration>1440){
  alert("Продолжительность: от 1 до 1440 минут.");
  return;
 }

 db.focus={
  active:true,
  paused:false,
  startedAt:Date.now(),
  elapsedBeforePause:0,
  targetMinutes:duration,
  taskName:name,
  taskId:null
 };

 save();
}

function pauseFocus(){
 const f=db.focus;
 if(!f.active)return;

 if(f.paused){
  f.startedAt=Date.now();
  f.paused=false;
 }else{
  f.elapsedBeforePause=focusElapsed();
  f.startedAt=null;
  f.paused=true;
 }

 save();
}

function finishFocus(){
 const f=db.focus;
 if(!f.active)return;

 const elapsed=focusElapsed();

 if(elapsed>=60){
  db.focusSessions.push({
   id:uid(),
   date:today(),
   name:f.taskName,
   minutes:Math.round(elapsed/60),
   completed:elapsed>=f.targetMinutes*60
  });
 }

 db.focus=defaults().focus;
 save();
}

function calendar(){
 const d=new Date();
 const year=d.getFullYear();
 const month=d.getMonth();

 const count=new Date(year,month+1,0).getDate();
 const offset=(new Date(year,month,1).getDay()+6)%7;

 let cells=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"]
 .map(x=>`<div class="muted" style="text-align:center">${x}</div>`);

 for(let i=0;i<offset;i++)cells.push("<div></div>");

 for(let i=1;i<=count;i++){
  const date=year+"-"+
   String(month+1).padStart(2,"0")+"-"+
   String(i).padStart(2,"0");

  const spent=db.expenses
   .filter(x=>x.date===date)
   .reduce((s,x)=>s+Number(x.amount),0);

  cells.push(`
  <div class="day">${i}
  <small>${spent?Math.round(spent)+" ₽":"·"}</small>
  </div>`);
 }

 return `<div class="calendar">${cells.join("")}</div>`;
}

const REPORT_HEADINGS={
 "ПРОЕКТ":"project",
 "ПОМОЩНИК":"agent",
 "ДАТА":"date",
 "СДЕЛАНО":"done",
 "ГДЕ ОСТАНОВИЛИСЬ":"stop",

 "СЛЕДУЮЩИЕ ЗАДАЧИ":"next",

 "GIT":"git",
 "ИСТОРИЯ СДЕЛОК":"trades",
 "ИТОГИ ТОРГОВОГО ДНЯ":"summary",
 "ИТОГ":"conclusion"
};

function parseReport(raw){
 const result={};
 let current="";

 for(const line of raw.split(/\r?\n/)){
  const match=line.match(/^([^:]{2,60}):\s*(.*)$/);
  const heading=match?.[1]?.trim().toUpperCase();

  if(heading&&REPORT_HEADINGS[heading]){
   current=REPORT_HEADINGS[heading];
   result[current]=match[2]||"";
  }else if(current){
   result[current]+="\n"+line;
  }
 }

 return result;
}

}

function fallbackCopy(text){
 const area=document.createElement("textarea");
 area.value=text;
 document.body.appendChild(area);
 area.select();

 const ok=document.execCommand("copy");
 area.remove();

 if(ok)alert("Скопировано");
 else prompt("Скопируй текст:",text);
}

function copy(text){
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(text).then(
   ()=>alert("Скопировано"),
   ()=>fallbackCopy(text)
  );
 }else{
  fallbackCopy(text);
 }
}

  db.financeTab=element.dataset.finance;
  render();

 }

 if(element.dataset.dev){
  db.devTab=element.dataset.dev;
  render();
  return;
 }

 const action=element.dataset.action;
 if(!action)return;

 if(action==="go-plans"){
  go("plans");
  return;
 }

 if(action==="go-focus"){
  go("focus");
  return;
 }

 if(action==="go-review"){
  go("review");

 }

 if(action==="open-salary"){
  db.financeTab="salary";

 }

 if(action==="save-day"){

  const sleep=Number($("sleep").value);

  if(!Number.isFinite(energy)||energy<1||energy>10||
   !Number.isFinite(sleep)||sleep<0||sleep>24||
   !Number.isFinite(breaks)||breaks<0||breaks>60){
   alert("Проверь энергию, сон и перерывы.");
   return;
  }

  db.shift=$("shift").value;
  db.location=$("location").value;
  db.energy=energy;
  db.sleep=sleep;
  db.sleepTime=$("sleepTime").value;
  db.plannerSettings.breakMinutes=breaks;

  generatePlan();
  render();
  return;
 }

 if(action==="build-plan"){
  generatePlan();
  render();
  return;
 }

 if(action==="emergency"){
  if(confirm(
   "Сохранить выполненное, а остальные "+
   "задачи отправить на перепланирование?"
  )){
   emergencyReplan();
  }
  render();
  return;
 }

 if(action==="focus-start"){
  startFocus();
  render();
  return;
 }

 if(action==="focus-pause"){
  pauseFocus();
  render();
  return;
 }

 if(action==="focus-finish"){
  finishFocus();
  render();
  return;
 }

 if(action==="save-limit"){

  const reserve=Number($("reservedBills").value);

  if(!Number.isFinite(limit)||limit<0||
   !Number.isFinite(reserve)||reserve<0){
   alert("Проверь суммы.");

  }

  if(toCents(reserve)>toCents(db.life)){

  db.dailyLimit=roundMoney(limit);
  db.reservedBills=roundMoney(reserve);
  db.limitMode=$("limitMode").value;
 }

 if(action==="save-capital"){
  const value=Number($("capital").value);

  if(!Number.isFinite(value)||value<0){
   alert("Проверь капитал.");
   return;
  }

  db.capital=roundMoney(value);
 }

 if(action.startsWith("delete-habit-")){

   db.tasks=db.tasks.filter(

 }

 if(action.startsWith("move-task-")){

   const date=prompt(
    "На какую дату перенести? ГГГГ-ММ-ДД",

   );

   if(date!==null){

    task.deferred=true;
    db.plannerMessage=
     "Задача перенесена на "+date+

 if(action.startsWith("delete-expense-")){

   x=>String(x.id)===id

 if(action==="parse-report"){
  db.raw=$("rawReport").value;

  if(!db.raw.trim()){
   alert("Вставь отчёт.");
   return;
  }

  db.draft=parseReport(db.raw);
  db.devTab="fields";
 }

 if(action==="clear-report"){
  if(confirm("Очистить текст отчёта?")){
   db.raw="";
   db.draft=null;
  }
 }

 if(action==="copy-last"){
  if(db.reports[0])copy(reportText(db.reports[0]));
 }

 if(action==="delete-last"){
  if(confirm("Удалить последний отчёт?")){
   db.reports.shift();
  }
 }

 if(action.startsWith("open-report-")){
  const i=Number(action.slice("open-report-".length));
  const report=db.reports[i];

  if(report){
   db.reports.splice(i,1);
   db.reports.unshift(report);
   db.devTab="latest";
  }
 }

 if(action.startsWith("delete-report-")){
  const i=Number(action.slice("delete-report-".length));

  if(confirm("Удалить отчёт?")){
   db.reports.splice(i,1);
  }
 }

 if(action==="check-day"){
  dailyReset();
  closeFinanceDays();
  alert("Проверка даты выполнена.");
 }

 if(action==="export"){
  const json=JSON.stringify({
   app:"ORACLE LIFE",
   version:APP_VERSION,
   exportedAt:new Date().toISOString(),
   data:db
  },null,2);

  const blob=new Blob([json],{
   type:"application/json"
  });

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download="oracle-life-"+today()+".json";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),3000);
 }

 if(action==="import"){
  $("backupFile").click();
 }

 if(action==="reset"){
  if(confirm("Удалить ВСЕ данные ORACLE LIFE?")&&
   confirm("Последнее подтверждение. Удалить?")){
   db=defaults();
   normalize();
  }
 }

 render();
});

/* ======================================
   ЧЕКБОКСЫ
   ====================================== */

document.addEventListener("change",e=>{
 const id=e.target.dataset.planItem;

 if(id){
  markDone(id,e.target.checked);
  render();
 }
});

document.addEventListener("input",e=>{
 if(e.target.id==="rawReport"){
  db.raw=e.target.value;
  save();
 }
});

/* ======================================
   ФОРМЫ
   ====================================== */

document.addEventListener("submit",e=>{
 const form=e.target.closest("form[data-form]");
 if(!form)return;

 e.preventDefault();

 const data=Object.fromEntries(new FormData(form));
 const type=form.dataset.form;

 if(type==="habit"){
  const duration=Number(data.duration);

  if(!data.name.trim()||
   !Number.isFinite(duration)||
   duration<5||duration>720){
   alert("Проверь привычку.");
   return;
  }

  db.habits.push({
   id:uid(),
   name:data.name.trim(),
   duration,
   required:data.required==="true",
   priority:data.priority,
   place:data.place,
   active:true
  });

  db.plannerMessage=
   "Привычка добавлена. Перестрой расписание.";
 }

 if(type==="task"){
  const duration=Number(data.duration);

  if(!data.name.trim()||
   !Number.isFinite(duration)||
   duration<5||duration>720||
   !validDate(data.scheduledDate)){
   alert("Проверь параметры задачи.");
   return;
  }

  db.tasks.push({
   id:uid(),
   name:data.name.trim(),
   duration,
   required:data.required==="true",
   priority:data.priority,
   place:data.place,
   scheduledDate:data.scheduledDate,
   done:false,
   deferred:false
  });

  db.plannerMessage=
   "Задача добавлена. Перестрой расписание.";
 }

 if(type==="salary"){
  const amounts=[
   data.salary,data.life,data.savings,data.bank
  ].map(toCents);

  if(amounts.some(x=>
   !Number.isSafeInteger(x)||x<0
  )){
   alert("Проверь суммы.");
   return;
  }

  if(amounts[1]+amounts[2]+amounts[3]>amounts[0]){
   alert("Распределение превышает зарплату.");
   return;
  }

  if(!validDate(data.date)||
   !validDate(data.nextPayday)||
   data.nextPayday<=data.date||
   data.nextPayday<=today()||
   data.date>today()){
   alert("Проверь даты зарплаты.");
   return;
  }

  if(db.salaryHistory.length&&
   !confirm(
    "Начать новый финансовый период? "+
    "Баланс Банка будет заменён введённым значением."
   ))return;

  startPeriod(data);
 }

 if(type==="expense"){
  const amount=toCents(data.amount);

  if(!data.name.trim()||
   !Number.isSafeInteger(amount)||amount<=0){
   alert("Проверь расход.");
   return;
  }

  db.expenses.push({
   id:uid(),
   name:data.name.trim(),
   amount:fromCents(amount),
   date:today()
  });
 }

 if(type==="bank"){
  const amount=toCents(data.amount);
  const take=e.submitter?.value==="take";

  if(!Number.isSafeInteger(amount)||amount<=0){
   alert("Проверь сумму.");
   return;
  }

  if(take&&amount>toCents(db.bank)){
   alert("Недостаточно денег.");
   return;
  }

  db.bank=fromCents(
   toCents(db.bank)+(take?-amount:amount)
  );

  db.bankHistory.push({
   id:uid(),
   date:today(),
   amount:fromCents(take?-amount:amount),
   note:take?"Снятие":"Пополнение",
   type:take?"MANUAL_WITHDRAW":"MANUAL_DEPOSIT"
  });
 }

 if(type==="goal"){
  const target=Number(data.target);
  const saved=Number(data.saved);

  if(!data.name.trim()||
   !Number.isFinite(target)||target<=0||
   !Number.isFinite(saved)||saved<0){
   alert("Проверь цель.");
   return;
  }

  db.financialGoals.push({
   id:uid(),
   name:data.name.trim(),
   target:roundMoney(target),
   saved:roundMoney(saved)
  });
 }

 if(type==="trade"){
  const stake=Number(data.stake);
  const payout=Number(data.payout);
  const result=e.submitter?.value==="loss"?
   "loss":"win";

  if(!Number.isFinite(stake)||stake<=0||
   !Number.isFinite(payout)||
   payout<0||payout>100){
   alert("Проверь сделку.");
   return;
  }

  const todayTrades=db.trades
   .filter(x=>x.date===today());

  let streak=0;

  for(let i=todayTrades.length-1;i>=0;i--){
   if(todayTrades[i].result==="loss")streak++;
   else break;
  }

  if(stake>(db.capital+pnl())*.01){
   if(!confirm(
    "Ставка превышает 1% капитала. Записать?"
   ))return;
  }

  if(todayTrades.length>=5||streak>=2){
   if(!confirm(
    "Достигнут торговый лимит. Записать?"
   ))return;
  }

  db.trades.push({
   id:uid(),
   date:today(),
   asset:data.asset,
   tf:data.tf,
   direction:data.direction,
   stake:roundMoney(stake),
   payout,
   result,
   pnl:result==="win"?
    roundMoney(stake*payout/100):
    -roundMoney(stake)
  });
 }

 if(type==="review"){
  const rating=Number(data.rating);

  if(!Number.isFinite(rating)||
   rating<1||rating>10||
   !data.text.trim()){
   alert("Проверь итог дня.");
   return;
  }

  db.dailyReviews[today()]={
   rating,
   text:data.text.trim(),
   savedAt:new Date().toISOString()
  };

  snapshotDay(today());
  db.tab="home";
 }

 if(type==="report"){
  db.reports.unshift({
   ...data,
   id:uid(),
   date:data.date||today(),
   source:db.raw
  });

  db.devTab="latest";
 }

 if(type==="idea"){
  if(data.text.trim()){
   db.ideas.push(data.text.trim());
  }
 }

 if(type==="note"){
  if(data.text.trim()){
   db.notes.push({
    date:today(),
    text:data.text.trim()
   });
  }
 }

 render();
});

/* ======================================
   ИМПОРТ JSON
   ====================================== */

$("backupFile").addEventListener("change",async e=>{
 const file=e.target.files?.[0];
 if(!file)return;

 try{
  const obj=JSON.parse(await file.text());

  if(obj.app!=="ORACLE LIFE"||
   !obj.data||
   typeof obj.data!=="object"||
   Array.isArray(obj.data)){
   throw new Error("Неверный формат резервной копии");
  }

  const restored={...defaults(),...obj.data};

  for(const field of ARRAY_FIELDS){
   if(!Array.isArray(restored[field])){
    throw new Error("Повреждён раздел "+field);
   }
  }

  if(confirm(
   "Заменить текущие данные резервной копией?"
  )){
   db=restored;
   normalize();
   dailyReset();
   closeFinanceDays();
   render();
  }
 }catch(error){
  alert("Ошибка импорта: "+error.message);
 }

 e.target.value="";
});

/* ======================================
   ФОНОВОЕ ОБНОВЛЕНИЕ
   ====================================== */

function tick(){
 if(db.lastActiveDate!==today()){
  dailyReset();
  closeFinanceDays();
  render();
  return;
 }

 const timer=$("timerDisplay");

 if(timer&&db.focus.active){
  timer.textContent=formatSeconds(focusRemaining());

  if(focusRemaining()<=0){
   timer.textContent="00:00";
  }
 }
}

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden){
  dailyReset();
  closeFinanceDays();
  render();
 }
});

window.addEventListener("focus",()=>{
 dailyReset();
 closeFinanceDays();
 render();
});

window.addEventListener("error",e=>{
 console.error("ORACLE LIFE ERROR:",e.error||e.message);
});

/* ======================================
   ЗАПУСК
   ====================================== */

normalize();
dailyReset();
closeFinanceDays();
render();

setInterval(tick,15000);

</script>
</body>
</html>
