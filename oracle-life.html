
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b14">
<title>ORACLE LIFE 7.3</title>
<style>
:root{
 --bg:#061610;--card:#102c22;--card2:#183d2e;
 --gold:#eac77e;--green:#25d99c;--text:#edf5ee;
 --muted:#b1c8b8;--line:#345c49;--red:#ffaaaa
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font:14px system-ui,Arial,sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
 padding:22px 17px;
 background:linear-gradient(120deg,#123d2b,#071b14);
 border-bottom:1px solid var(--line)
}
.brand{font:bold 30px Georgia,serif;color:var(--gold)}
.brand span{color:var(--green)}
.slogan{font-size:11px;color:var(--gold);margin-top:9px}
.sub{color:var(--muted);margin-top:12px}
main{max-width:760px;margin:auto;padding:15px 14px 110px}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:17px;padding:16px;margin-bottom:15px
}
h2{color:var(--gold);font-size:20px;margin:0 0 14px}
h3{color:var(--gold);font-size:16px}
p{line-height:1.55}
.muted{color:var(--muted);font-size:12px}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px
}
.tile{
 background:var(--card2);padding:12px;
 border-radius:11px;min-width:0
}
.value{
 color:var(--gold);font-size:19px;font-weight:800;
 overflow-wrap:anywhere
}
label{display:block;color:var(--gold);margin:12px 0 5px}
input,textarea,select{
 width:100%;background:#071d16;color:white;
 border:1px solid #47705a;border-radius:9px;
 padding:12px;outline:none
}
input:focus,textarea:focus,select:focus{
 border-color:var(--green)
}
textarea{min-height:95px;resize:vertical}
button.btn{
 background:var(--green);color:#06261b;border:0;
 padding:12px;border-radius:10px;font-weight:800
}
button.alt{background:#24503c;color:white}
button.danger{background:#74383e;color:white}
.buttons{
 display:flex;flex-wrap:wrap;gap:8px;margin-top:13px
}
.buttons button{flex:1;min-width:105px}
.row{
 display:flex;justify-content:space-between;
 align-items:center;gap:9px;
 border-bottom:1px solid var(--line);padding:11px 0
}
.row span{color:var(--gold);overflow-wrap:anywhere}
.row small{color:var(--muted);display:block}
.nav{
 position:fixed;bottom:0;left:0;right:0;
 display:grid;grid-template-columns:repeat(5,1fr);
 background:#09251b;border-top:1px solid var(--line);
 padding:7px 3px calc(7px + env(safe-area-inset-bottom));
 z-index:10
}
.nav button{
 background:none;border:0;color:#d0e0d4;
 font-size:11px;padding:8px 2px;border-radius:10px
}
.nav button.active{background:#20513d;color:var(--gold)}
.nav b{display:block;font-size:20px;margin-bottom:4px}
.tabs{
 display:flex;gap:7px;overflow-x:auto;padding-bottom:11px
}
.tabs button{
 flex-shrink:0;background:#1a3c2d;color:white;
 border:1px solid var(--line);padding:10px;border-radius:9px
}
.tabs button.active{
 color:var(--gold);border-color:var(--gold)
}
.green{color:var(--green)}
.red{color:var(--red)}
.notice{
 padding:12px;background:#42282b;
 border-radius:10px;color:#ffd1d1;margin:10px 0
}
.success{
 padding:12px;background:#174b36;
 border-radius:10px;color:#b8ffdb;margin:10px 0
}
pre{
 white-space:pre-wrap;overflow-wrap:anywhere;
 background:#071d16;padding:12px;border-radius:9px
}
.check{width:20px;height:20px;accent-color:var(--green)}
.calendar{
 display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
 gap:3px
}
.day{
 text-align:center;background:var(--card2);
 border-radius:8px;padding:8px 2px;min-width:0
}
.day small{display:block;font-size:9px;color:var(--muted)}
.schedule{
 border-left:3px solid var(--green);
 padding:10px 12px;margin:9px 0;
 background:var(--card2);border-radius:0 10px 10px 0
}
.schedule.required{border-color:var(--gold)}
.schedule.break{border-color:#8cae9e}
.schedule.done{opacity:.6}
.schedule .time{color:var(--gold);font-weight:800}
.schedule .name{font-weight:700;margin:5px 0}
.chip{
 display:inline-block;border:1px solid var(--line);
 border-radius:20px;padding:4px 9px;
 font-size:11px;color:var(--muted);margin:3px
}
details{margin-top:12px}
summary{color:var(--gold);cursor:pointer}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
@media(max-width:380px){
 .value{font-size:16px}
 .card{padding:12px}
}
</style>
</head>
<body>

<header>
 <div class="brand">◈ ORACLE <span>LIFE</span></div>
 <div class="slogan">
 ПОРЯДОК В НАСТОЯЩЕМ. ВЛАСТЬ НАД БУДУЩИМ.
 </div>
 <div class="sub">
 MR. ARCANUM · Личный командный центр · 7.3
 </div>
</header>

<main id="main">Загрузка...</main>
<nav class="nav" id="nav"></nav>
<input type="file" id="backupFile" accept=".json" hidden>

<script>
"use strict";

/* =====================================
   ORACLE LIFE 7.3
   HYBRID SMART PLANNER
   ===================================== */

const KEY="oracle-life-v71-clean";
const $=id=>document.getElementById(id);

function dateNow(){
 const d=new Date();
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}

function uid(){
 return Date.now()+"-"+Math.random().toString(36).slice(2,9);
}

function cents(value){
 return Math.round(Number(value||0)*100);
}

function rub(value){
 return value/100;
}

function round(value){
 return rub(cents(value));
}

function money(value){
 return Number(value||0).toLocaleString("ru-RU",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 })+" ₽";
}

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function validDate(value){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value||""))return false;
 const d=new Date(value+"T12:00:00Z");
 return !Number.isNaN(d.getTime())&&
 d.toISOString().slice(0,10)===value;
}

function dayNumber(value){
 return Math.floor(Date.parse(value+"T12:00:00Z")/86400000);
}

function dayString(value){
 return new Date(value*86400000).toISOString().slice(0,10);
}

function previousDay(value){
 return dayString(dayNumber(value)-1);
}

function card(title,body){
 return `<section class="card"><h2>${title}</h2>${body}</section>`;
}

function tile(name,value){
 return `<div class="tile">
 <div class="muted">${name}</div>
 <div class="value">${value}</div>
 </div>`;
}

function btn(name,action,style=""){
 return `<button type="button" class="btn ${style}"
 data-action="${action}">${name}</button>`;
}

function row(name,value){
 return `<div class="row">
 <span>${esc(name)}</span><b>${value}</b>
 </div>`;
}

function tabs(items,current,attribute){
 return `<div class="tabs">${items.map(([id,name])=>
 `<button type="button" data-${attribute}="${id}"
 class="${current===id?"active":""}">${name}</button>`
 ).join("")}</div>`;
}

function defaults(){
 return {
  tab:"home",more:"dev",financeTab:"budget",
  devTab:"import",shift:"off",
  salary:0,life:0,savings:0,bank:0,
  dailyLimit:0,limitMode:"auto",
  nextPayday:"",periodStart:"",
  periodId:"",lastClosedDay:"",
  reservedBills:0,capital:10000,
  salaryHistory:[],expenses:[],bankHistory:[],
  tasks:[],trades:[],reports:[],
  ideas:[],notes:[],
  raw:"",draft:null,energy:7,sleep:8,

  location:"home",
  wakeTime:"08:00",
  sleepTime:"23:00",
  plannerDate:"",
  plannerMessage:"",
  habits:[],
  dayPlans:{},
  plannerSettings:{
   breakMinutes:15,
   maxFocusMinutes:180
  }
 };
}

let db;

try{
 db={
  ...defaults(),
  ...JSON.parse(localStorage.getItem(KEY)||"{}")
 };
}catch(e){
 console.error(e);
 db=defaults();
}

const arrays=[
 "salaryHistory","expenses","bankHistory",
 "tasks","trades","reports","ideas","notes","habits"
];

for(const name of arrays){
 if(!Array.isArray(db[name]))db[name]=[];
}

if(!db.dayPlans||typeof db.dayPlans!=="object"||
 Array.isArray(db.dayPlans))db.dayPlans={};

if(!db.plannerSettings||
 typeof db.plannerSettings!=="object"){
 db.plannerSettings=defaults().plannerSettings;
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
  return true;
 }catch(e){
  console.error(e);
  alert("Ошибка сохранения. Проверь память устройства.");
  return false;
 }
}

/* =====================================
   ПЛАНИРОВЩИК
   ===================================== */

const SHIFTS=[
 ["off","🏡 Выходной"],
 ["day","☀️ День 08:00–20:00"],
 ["night","🌙 Ночь 20:00–08:00"],
 ["recovery","😴 Отсыпной"]
];

const LOCATIONS=[
 ["home","🏠 Дома"],
 ["work","🏭 На работе"],
 ["road","🚗 В дороге"],
 ["outside","🌍 Вне дома"]
];

const PRIORITIES=[
 ["high","🔴 Высокий"],
 ["normal","🟡 Обычный"],
 ["low","🟢 Низкий"]
];

function selectOptions(items,current){
 return items.map(([id,name])=>
 `<option value="${id}" ${id===current?"selected":""}>
 ${name}</option>`).join("");
}

function minutes(time){
 const parts=String(time||"00:00").split(":");
 return Number(parts[0])*60+Number(parts[1]);
}

function timeText(value){
 const m=((Math.floor(value)%1440)+1440)%1440;
 return String(Math.floor(m/60)).padStart(2,"0")+":"+
 String(m%60).padStart(2,"0");
}

function clamp(value,min,max){
 return Math.max(min,Math.min(max,value));
}

function currentPlan(){
 return db.dayPlans[dateNow()]||null;
}

function priorityWeight(value){
 return value==="high"?3:value==="normal"?2:1;
}

function taskLocationAllowed(task){
 const place=task.place||"any";
 return place==="any"||place===db.location;
}

function sleepBlocks(){
 const start=minutes(db.sleepTime||"23:00");
 const hours=clamp(Number(db.sleep)||8,0,24);
 const duration=Math.round(hours*60);
 if(duration===0)return [];

 const blocks=[];
 const end=start+duration;

 if(end<=1440){
  blocks.push([start,end]);
 }else{
  blocks.push([start,1440]);
  blocks.push([0,end-1440]);
 }

 return blocks;
}

function busyBlocks(){
 const blocks=[...sleepBlocks()];

 if(db.shift==="day"){
  blocks.push([480,1200]);
 }

 if(db.shift==="night"){
  blocks.push([0,480],[1200,1440]);
 }

 if(db.shift==="recovery"){
  blocks.push([480,720]);
 }

 return blocks;
}

function freeWindows(){
 const blocks=busyBlocks()
  .map(([a,b])=>[clamp(a,0,1440),clamp(b,0,1440)])
  .sort((a,b)=>a[0]-b[0]);

 const merged=[];

 for(const block of blocks){
  const last=merged[merged.length-1];
  if(last&&block[0]<=last[1]){
   last[1]=Math.max(last[1],block[1]);
  }else{
   merged.push([...block]);
  }
 }

 const windows=[];
 let cursor=0;

 for(const [start,end] of merged){
  if(start>cursor)windows.push([cursor,start]);
  cursor=Math.max(cursor,end);
 }

 if(cursor<1440)windows.push([cursor,1440]);

 return windows;
}

function effectiveDuration(task){
 const original=clamp(
  Number(task.duration)||30,5,720
 );

 if(task.required)return original;

 const energy=clamp(Number(db.energy)||7,1,10);
 const sleep=clamp(Number(db.sleep)||8,0,24);

 let factor=1;

 if(energy<=3)factor=.45;
 else if(energy<=5)factor=.7;
 else if(energy>=9)factor=1.1;

 if(sleep<6)factor=Math.min(factor,.65);

 return clamp(
  Math.round(original*factor/5)*5,
  5,720
 );
}

function candidatesForToday(){
 const today=dateNow();

 const habits=db.habits
  .filter(x=>x.active!==false)
  .map(x=>({
   ...x,
   source:"habit",
   sourceId:x.id,
   done:false
  }));

 const tasks=db.tasks
  .filter(x=>!x.done&&
   (!x.scheduledDate||x.scheduledDate<=today))
  .map(x=>({
   ...x,
   source:"task",
   sourceId:x.id,
   required:x.required===true,
   place:x.place||"any",
   priority:x.priority||"normal",
   duration:Number(x.duration)||60,
   done:false
  }));

 return [...habits,...tasks].sort((a,b)=>{
  if(Boolean(a.required)!==Boolean(b.required)){
   return a.required?-1:1;
  }
  return priorityWeight(b.priority)-
   priorityWeight(a.priority);
 });
}

function generatePlan(){
 const today=dateNow();
 const old=currentPlan();

 const completed=new Map();

 if(old){
  for(const item of old.items||[]){
   if(item.done){
    completed.set(
     item.source+":"+item.sourceId,
     item
    );
   }
  }
 }

 const candidates=candidatesForToday();

 const items=[];
 const deferred=[];
 const windows=freeWindows();
 const breakTime=clamp(
  Number(db.plannerSettings.breakMinutes)||15,
  0,60
 );

 let totalMinutes=0;

 for(const task of candidates){
  const key=task.source+":"+task.sourceId;

  if(completed.has(key)){
   items.push({...completed.get(key)});
   continue;
  }

  if(!taskLocationAllowed(task)){
   deferred.push({
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    reason:"Недоступно в текущем местонахождении"
   });
   continue;
  }

  const duration=effectiveDuration(task);
  let placed=false;

  for(let i=0;i<windows.length;i++){
   const window=windows[i];

   if(window[1]-window[0]<duration)continue;

   const start=window[0];
   const end=start+duration;

   items.push({
    id:uid(),
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    priority:task.priority||"normal",
    start,end,duration,
    done:false
   });

   window[0]=Math.min(
    window[1],end+breakTime
   );

   totalMinutes+=duration;
   placed=true;
   break;
  }

  if(!placed){
   deferred.push({
    source:task.source,
    sourceId:task.sourceId,
    name:task.name,
    required:Boolean(task.required),
    reason:"Не хватает свободного времени"
   });
  }
 }

 items.sort((a,b)=>a.start-b.start);

 const requiredMissed=deferred.filter(x=>x.required);
 const flexibleMissed=deferred.filter(x=>!x.required);

 db.dayPlans[today]={
  date:today,
  createdAt:new Date().toISOString(),
  shift:db.shift,
  location:db.location,
  energy:db.energy,
  sleep:db.sleep,
  items,deferred,totalMinutes
 };

 db.plannerDate=today;

 db.plannerMessage=
  "План сформирован: "+
  items.filter(x=>!x.done).length+
  " задач · "+
  totalMinutes+
  " минут. "+
  (requiredMissed.length?
   "Обязательных без места: "+requiredMissed.length+". ":"")+
  (flexibleMissed.length?
   "Гибких отложено: "+flexibleMissed.length+".":"");

 save();
}

function markPlanItem(id,done){
 const plan=currentPlan();
 if(!plan)return;

 const item=plan.items.find(x=>String(x.id)===id);
 if(!item)return;

 item.done=done;

 if(item.source==="task"){
  const task=db.tasks.find(
   x=>String(x.id)===String(item.sourceId)
  );
  if(task)task.done=done;
 }

 save();
}

function replanToday(){
 const plan=currentPlan();

 if(!plan){
  generatePlan();
  return;
 }

 const unfinished=plan.items.filter(x=>!x.done);

 for(const item of unfinished){
  if(!plan.deferred.some(x=>
   x.source===item.source&&
   String(x.sourceId)===String(item.sourceId)
  )){
   plan.deferred.push({
    source:item.source,
    sourceId:item.sourceId,
    name:item.name,
    required:item.required,
    reason:"Изменение планов"
   });
  }
 }

 plan.items=plan.items.filter(x=>x.done);

 db.plannerMessage=
  "Выполненные дела сохранены. "+
  "Остальные перенесены в список ожидания.";

 save();
}

function planStats(){
 const plan=currentPlan();

 if(!plan)return {
  total:0,done:0,pending:0,deferred:0
 };

 return {
  total:plan.items.length,
  done:plan.items.filter(x=>x.done).length,
  pending:plan.items.filter(x=>!x.done).length,
  deferred:plan.deferred.length
 };
}

/* =====================================
   ГЛАВНАЯ
   ===================================== */

function pnl(){
 return round(db.trades.reduce(
  (sum,x)=>sum+Number(x.pnl||0),0
 ));
}

function home(){
 const stats=planStats();
 const last=db.reports[0];

 return card("🏛️ ORACLE COMMAND",`
 <div class="grid">
 ${tile("Бюджет",money(available()))}
 ${tile("Свободный банк",money(db.bank))}
 ${tile("Задачи сегодня",stats.pending)}
 ${tile("Торговля",money(pnl()))}
 </div>
 <div class="buttons">
 ${btn("📅 План дня","go-plans")}
 ${btn("💻 DEV MEMORY","go-dev","alt")}
 </div>
 `)+card("☀️ DAILY BRIEFING",`
 ${row("Дата",dateNow())}
 ${row("Энергия",db.energy+"/10")}
 ${row("Сон",db.sleep+" ч")}
 ${row("Выполнено сегодня",stats.done)}
 ${row("Ожидают выполнения",stats.pending)}
 ${row("Отложено",stats.deferred)}
 ${row("Торговых сделок сегодня",
 db.trades.filter(x=>x.date===dateNow()).length)}
 `)+card("💻 Последняя работа",last?`
 <h3>${esc(last.project||"Без названия")}</h3>
 <p>${esc(last.stop||last.done||"Отчёт сохранён")}</p>
 ${btn("Скопировать отчёт","copy-last")}
 `:"<p class='muted'>Отчётов пока нет.</p>");
}

/* =====================================
   ЭКРАН ПЛАНОВ
   ===================================== */

function plans(){
 const plan=currentPlan();
 const stats=planStats();

 let scheduleHtml="";

 if(plan){
  scheduleHtml=`
  <div class="grid">
  ${tile("Запланировано",stats.total)}
  ${tile("Выполнено",stats.done)}
  ${tile("Осталось",stats.pending)}
  ${tile("Отложено",stats.deferred)}
  </div>

  ${plan.items.length?
   plan.items.map(item=>`
   <div class="schedule ${item.required?"required":""}
    ${item.done?"done":""}">
    <div class="time">
    ${timeText(item.start)}–${timeText(item.end)}
    </div>
    <div class="name">${esc(item.name)}</div>
    <span class="chip">
    ${item.required?"🔒 Обязательная":"🔄 Гибкая"}
    </span>
    <span class="chip">${item.duration} мин</span>
    <label style="display:flex;align-items:center;gap:9px">
    <input type="checkbox" class="check"
    data-plan-item="${esc(item.id)}"
    ${item.done?"checked":""}>
    Выполнено
    </label>
   </div>`).join("")
   :"<p class='muted'>В расписании пока нет задач.</p>"}

  ${plan.deferred.length?`
  <h3>📦 Отложенные задачи</h3>
  ${plan.deferred.map(x=>`
   <div class="row">
   <span>${esc(x.name)}
   <small>${esc(x.reason)}</small>
   </span>
   <b>${x.required?"🔒":"🔄"}</b>
   </div>`).join("")}
  `:""}

  <div class="buttons">
  ${btn("🔄 Перестроить расписание","build-plan")}
  ${btn("🚨 Сегодня не по плану","replan","alt")}
  </div>
  `;
 }else{
  scheduleHtml=`
  <p class="muted">
  Расписание ещё не сформировано.
  Настрой параметры дня и нажми кнопку ниже.
  </p>
  <div class="buttons">
  ${btn("🧠 Сформировать мой день","build-plan")}
  </div>`;
 }

 return card("📅 Настройки моего дня",`
 <label>Тип дня</label>
 <select id="shift">
 ${selectOptions(SHIFTS,db.shift)}
 </select>

 <label>Где я нахожусь</label>
 <select id="location">
 ${selectOptions(LOCATIONS,db.location)}
 </select>

 <label>Энергия, от 1 до 10</label>
 <input id="energy" type="number"
 min="1" max="10" value="${db.energy}">

 <label>Сон, часов</label>
 <input id="sleep" type="number"
 min="0" max="24" step="0.5" value="${db.sleep}">

 <label>Время начала сна</label>
 <input id="sleepTime" type="time"
 value="${esc(db.sleepTime)}">

 <p class="muted">
 Смена и сон считаются занятым временем.
 Гибкие задачи сокращаются при усталости.
 Обязательные не сокращаются автоматически.
 </p>

 <div class="buttons">
 ${btn("💾 Сохранить и построить день","save-day")}
 </div>

 ${db.plannerMessage?
 `<div class="success">${esc(db.plannerMessage)}</div>`:""}
 `)+card("🧠 Моё расписание",scheduleHtml)+

 card("🔒 Постоянные привычки",`
 <p class="muted">
 Добавь свои ежедневные занятия.
 Обязательные не будут автоматически удаляться.

function periodExpenses(){
 return db.expenses.filter(x=>
  !db.periodStart||
  (x.date>=db.periodStart&&
   (!validDate(db.nextPayday)||x.date<db.nextPayday))
 );
}

function periodTransfers(){
 return db.bankHistory.filter(x=>
  x.type==="AUTO_SAVINGS"&&
  x.periodId===db.periodId
 );
}

function spentCents(before){
 return periodExpenses()
 .filter(x=>!before||x.date<=before)
 .reduce((n,x)=>n+cents(x.amount),0);
}

function transferredCents(before){
 return periodTransfers()
 .filter(x=>!before||x.date<=before)
 .reduce((n,x)=>n+cents(x.amount),0);
}

function sumExpenses(){
 return rub(spentCents());
}

function available(){
 return rub(
  cents(db.life)-spentCents()-
  transferredCents()-cents(db.reservedBills)
 );
}

function unallocated(){
 return rub(
  cents(db.salary)-cents(db.life)-
  cents(db.savings)-cents(db.bank)
 );
}

function financePlan(){
 const today=dateNow();
 const valid=validDate(db.nextPayday)&&
  db.nextPayday>today;

 const days=valid?
  dayNumber(db.nextPayday)-dayNumber(today):0;

 const todaySpent=periodExpenses()
 .filter(x=>x.date===today)
 .reduce((n,x)=>n+cents(x.amount),0);

 const balance=
  cents(db.life)-spentCents()-
  transferredCents()-cents(db.reservedBills);

 const beforeToday=balance+todaySpent;

 const limit=valid?
  (db.limitMode==="manual"?
   Math.max(0,cents(db.dailyLimit)):
   Math.max(0,Math.floor(beforeToday/days))):0;

 return {
  valid,days,limit,todaySpent,balance,
  left:Math.max(0,Math.min(balance,limit-todaySpent)),
  over:Math.max(0,todaySpent-limit)
 };
}

function migrateFinance(){
 if(!db.periodStart){
  db.periodStart=dateNow();
  db.lastClosedDay=previousDay(dateNow());
 }

 if(!db.periodId){
  db.periodId="legacy:"+db.periodStart;
 }

 if(!validDate(db.lastClosedDay)){
  db.lastClosedDay=previousDay(dateNow());
 }

 if(!["auto","manual"].includes(db.limitMode)){
  db.limitMode="auto";
 }

 if(!Number.isFinite(Number(db.reservedBills))||
  db.reservedBills<0){
  db.reservedBills=0;
 }
}

function closeFinanceDays(){
 if(!validDate(db.periodStart)||
  !validDate(db.nextPayday)||
  db.nextPayday<=db.periodStart)return;

 const today=dateNow();

 const first=Math.max(
  dayNumber(db.periodStart),
  dayNumber(db.lastClosedDay)+1
 );

 const end=Math.min(
  dayNumber(today)-1,
  dayNumber(db.nextPayday)-1
 );

 if(first>end||end-first>3700)return;

 for(let n=first;n<=end;n++){
  const day=dayString(n);
  const daysLeft=dayNumber(db.nextPayday)-n;

  const spentBefore=periodExpenses()
   .filter(x=>x.date<day)
   .reduce((s,x)=>s+cents(x.amount),0);

  const spentToday=periodExpenses()
   .filter(x=>x.date===day)
   .reduce((s,x)=>s+cents(x.amount),0);

  const savedBefore=periodTransfers()
   .filter(x=>x.date<day)
   .reduce((s,x)=>s+cents(x.amount),0);

  const opening=
   cents(db.life)-cents(db.reservedBills)-
   spentBefore-savedBefore;

  const limit=db.limitMode==="manual"?
   Math.max(0,cents(db.dailyLimit)):
   Math.max(0,Math.floor(opening/daysLeft));

  const saving=Math.max(
   0,Math.min(opening-spentToday,limit-spentToday)
  );

  const exists=periodTransfers()
   .some(x=>x.date===day);

  if(saving>0&&!exists){
   db.bankHistory.push({
    id:"auto:"+db.periodId+":"+day,
    date:day,
    amount:rub(saving),
    note:"Автонакопление за "+day,
    type:"AUTO_SAVINGS",
    periodId:db.periodId
   });

   db.bank=rub(cents(db.bank)+saving);
  }

  db.lastClosedDay=day;
 }

 save();
}

function startNewPeriod(data){
 db.salary=round(data.salary);
 db.life=round(data.life);
 db.savings=round(data.savings);
 db.bank=round(data.bank);

 db.periodStart=data.date;
 db.nextPayday=data.nextPayday;
 db.periodId=uid();
 db.lastClosedDay=previousDay(data.date);
 db.reservedBills=0;

 db.salaryHistory.push({
  id:uid(),
  date:data.date,
  period:data.period,
  salary:db.salary,
  life:db.life,
  savings:db.savings,
  bank:db.bank,
  periodId:db.periodId
 });
}

function calendar(){
 const now=new Date();
 const y=now.getFullYear(),m=now.getMonth();
 const days=new Date(y,m+1,0).getDate();
 const offset=(new Date(y,m,1).getDay()+6)%7;

 let cells=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"]
 .map(x=>`<div class="muted" style="text-align:center">${x}</div>`);

 for(let i=0;i<offset;i++)cells.push("<div></div>");

 for(let day=1;day<=days;day++){
  const d=y+"-"+
   String(m+1).padStart(2,"0")+"-"+
   String(day).padStart(2,"0");

  const spent=db.expenses
   .filter(x=>x.date===d)
   .reduce((s,x)=>s+Number(x.amount),0);

  cells.push(`<div class="day">${day}
  <small>${spent?Math.round(spent)+" ₽":"·"}</small>
  </div>`);
 }

 return `<div class="calendar">${cells.join("")}</div>`;
}

function parseReport(raw){
 const r={};
 let current="";

 for(const line of raw.split(/\r?\n/)){
  const m=line.match(/^([^:]{2,60}):\s*(.*)$/);
  const heading=m?.[1]?.trim().toUpperCase();

  if(heading&&HEADINGS[heading]){
   current=HEADINGS[heading];
   r[current]=m[2]||"";
  }else if(current){
   r[current]+="\n"+line;
  }
 }

 return r;
}

  ${btn("📋 Скопировать","copy-last")}
  ${btn("🗑️ Удалить","delete-last","danger")}
  </div>

  <details>
  <summary>Оригинальный отчёт</summary>
  <pre>${esc(r.source||"Не указан")}</pre>
  </details>
  `:"<p>Нет сохранённых отчётов.</p>");
 }

 return nav+card("🗂️ Архив",
 db.reports.length?
 db.reports.map((r,i)=>`
 <div class="tile" style="margin-bottom:10px">
 <b style="color:var(--gold)">
 ${esc(r.project||"Без названия")}
 </b>
 <p class="muted">${esc(r.date||"")}</p>
 <div class="buttons">
 ${btn("Открыть","open-report-"+i,"alt")}
 ${btn("Удалить","delete-report-"+i,"danger")}
 </div>
 </div>`).join("")
 :"Архив пуст");
}

/* =====================================
   ЕЩЁ

 return nav+card("⚙️ Резервные копии",`

/* =====================================
   ОТОБРАЖЕНИЕ
   ===================================== */

function render(){
 const pages={home,plans,finance,trade,more};

 if(!pages[db.tab])db.tab="home";

 $("nav").innerHTML=[
  ["home","🏛️","Главная"],
  ["plans","📅","Планы"],
  ["finance","💳","Финансы"],
  ["trade","📈","Трейдинг"],
  ["more","⚙️","Ещё"]
 ].map(([id,icon,name])=>`
 <button data-tab="${id}"
 class="${db.tab===id?"active":""}">
 <b>${icon}</b>${name}</button>
 `).join("");

 try{
  $("main").innerHTML=pages[db.tab]();
 }catch(e){
  console.error(e);
  $("main").textContent=
   "Ошибка отображения: "+e.message;
 }

 save();
}

function fallbackCopy(text){
 const a=document.createElement("textarea");
 a.value=text;
 document.body.appendChild(a);
 a.select();

 const ok=document.execCommand("copy");
 a.remove();

 if(ok)alert("Скопировано");
 else prompt("Скопируй текст:",text);
}

function copy(text){
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(text).then(
   ()=>alert("Скопировано"),
   ()=>fallbackCopy(text)
  );
 }else{
  fallbackCopy(text);
 }
}

/* =====================================
   ОБРАБОТКА КНОПОК
   ===================================== */

document.addEventListener("click",e=>{
 const b=e.target.closest(
  "[data-tab],[data-more],[data-finance],"+
  "[data-dev],[data-action]"
 );

 if(!b)return;

 if(b.dataset.tab){
  db.tab=b.dataset.tab;
  render();
  return;
 }

 if(b.dataset.more){
  db.more=b.dataset.more;
  render();
  return;
 }

 if(b.dataset.finance){
  db.financeTab=b.dataset.finance;
  render();
  return;
 }

 if(b.dataset.dev){
  db.devTab=b.dataset.dev;
  render();
  return;
 }

 const a=b.dataset.action;
 if(!a)return;

 if(a.startsWith("go-")){
  const dest=a.slice(3);
  db.tab=dest==="dev"?"more":dest;
  if(dest==="dev")db.more="dev";
  render();
  return;
 }

 if(a==="open-salary"){
  db.financeTab="salary";
  render();
  return;
 }

 if(a==="save-day"){
  const energy=Number($("energy").value);
  const sleep=Number($("sleep").value);

  if(!Number.isFinite(energy)||energy<1||energy>10||
   !Number.isFinite(sleep)||sleep<0||sleep>24){
   alert("Проверь показатели энергии и сна.");
   return;
  }

  db.shift=$("shift").value;
  db.location=$("location").value;
  db.energy=energy;
  db.sleep=sleep;
  db.sleepTime=$("sleepTime").value;

  generatePlan();
  render();
  return;
 }

 if(a==="build-plan"){
  generatePlan();
  render();
  return;
 }

 if(a==="replan"){
  if(confirm(
   "Сохранить выполненные задачи, "+
   "а остальные перенести в список ожидания?"
  )){
   replanToday();
  }
  render();
  return;
 }

 if(a==="save-limit"){
  const limit=Number($("dailyLimit").value);
  const reserve=Number($("reservedBills").value);

  if(!Number.isFinite(limit)||limit<0||
   !Number.isFinite(reserve)||reserve<0){
   alert("Проверь суммы.");
   return;
  }

  if(cents(reserve)>cents(db.life)){
   alert("Резерв превышает бюджет на жизнь.");
   return;
  }

  db.dailyLimit=round(limit);
  db.reservedBills=round(reserve);
  db.limitMode=$("limitMode").value;
 }

 if(a==="save-capital"){
  const value=Number($("capital").value);

  if(!Number.isFinite(value)||value<0){
   alert("Проверь капитал.");
   return;
  }

  db.capital=round(value);
 }

 if(a.startsWith("delete-habit-")){
  const id=a.slice("delete-habit-".length);

  if(confirm("Удалить привычку?")){
   db.habits=db.habits.filter(
    x=>String(x.id)!==id
   );
  }
 }

 if(a.startsWith("delete-task-")){
  const id=a.slice("delete-task-".length);

  if(confirm("Удалить задачу?")){
   db.tasks=db.tasks.filter(
    x=>String(x.id)!==id
   );
  }
 }

 if(a.startsWith("delete-expense-")){
  const id=a.slice("delete-expense-".length);

  const expense=db.expenses.find(
   x=>String(x.id)===id
  );

  if(expense&&expense.date>=db.periodStart&&
   validDate(db.lastClosedDay)&&
   expense.date<=db.lastClosedDay){
   alert(
    "Этот финансовый день закрыт. "+
    "Удаление заблокировано, чтобы "+
    "не нарушить накопления."
   );
   return;
  }

  if(confirm("Удалить этот расход?")){
   db.expenses=db.expenses.filter(
    x=>String(x.id)!==id
   );
  }
 }

 if(a==="clear-raw"){
  if(confirm("Очистить текст отчёта?")){
   db.raw="";
   db.draft=null;
  }
 }

 if(a==="parse"){
  db.raw=$("rawReport").value;

  if(!db.raw.trim()){
   alert("Сначала вставь отчёт.");
   return;
  }

  db.draft=parseReport(db.raw);
  db.devTab="fields";
 }

 if(a==="clear-draft"){
  db.draft=null;
  db.devTab="import";
 }

 if(a==="copy-last"){
  if(db.reports[0]){
   copy(reportText(db.reports[0]));
  }
 }

 if(a==="delete-last"){
  if(confirm("Удалить последнюю сессию?")){
   db.reports.shift();
  }
 }

 if(a.startsWith("open-report-")){
  const i=Number(a.slice("open-report-".length));
  const r=db.reports[i];

  if(r){
   db.reports.splice(i,1);
   db.reports.unshift(r);
   db.devTab="latest";
  }
 }

 if(a.startsWith("delete-report-")){
  const i=Number(a.slice("delete-report-".length));

  if(confirm("Удалить отчёт?")){
   db.reports.splice(i,1);
  }
 }

 if(a==="export"){
  const data=JSON.stringify({
   app:"ORACLE LIFE",
   version:73,
   data:db
  },null,2);

  const blob=new Blob(
   [data],{type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download=
   "oracle-life-backup-"+dateNow()+".json";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),3000);
 }

 if(a==="import"){
  $("backupFile").click();
 }

 if(a==="reset"){
  if(confirm("Удалить ВСЕ данные ORACLE LIFE?")&&
   confirm("Точно удалить? Это необратимо.")){
   db=defaults();
   migrateFinance();
  }
 }

 render();
});

/* =====================================
   ФОРМЫ
   ===================================== */

document.addEventListener("submit",e=>{
 const form=e.target.closest("form[data-form]");
 if(!form)return;

 e.preventDefault();

 const data=Object.fromEntries(new FormData(form));
 const type=form.dataset.form;

 if(type==="habit"){
  const duration=Number(data.duration);

  if(!data.name.trim()||
   !Number.isFinite(duration)||
   duration<5||duration>720){
   alert("Проверь название и длительность.");
   return;
  }

  db.habits.push({
   id:uid(),
   name:data.name.trim(),
   duration,
   required:data.required==="true",
   priority:data.priority,
   place:data.place,
   active:true
  });

  db.plannerMessage=
   "Привычка добавлена. Перестрой расписание.";
 }

 if(type==="task"){
  const duration=Number(data.duration);

  if(!data.name.trim()||
   !Number.isFinite(duration)||
   duration<5||duration>720||
   !validDate(data.scheduledDate)){
   alert("Проверь параметры задачи.");
   return;
  }

  db.tasks.push({
   id:uid(),
   name:data.name.trim(),
   duration,
   required:data.required==="true",
   priority:data.priority,
   place:data.place,
   scheduledDate:data.scheduledDate,
   done:false,
   deferred:false
  });

  db.plannerMessage=
   "Разовая задача добавлена. Перестрой расписание.";
 }

 if(type==="salary"){
  const salary=cents(data.salary);
  const life=cents(data.life);
  const savings=cents(data.savings);
  const bank=cents(data.bank);

  if([salary,life,savings,bank].some(
   x=>!Number.isSafeInteger(x)||x<0
  )){
   alert("Проверь суммы.");
   return;
  }

  if(life+savings+bank>salary){
   alert("Распределение превышает зарплату.");
   return;
  }

  if(!validDate(data.date)||
   !validDate(data.nextPayday)||
   data.nextPayday<=data.date||
   data.nextPayday<=dateNow()){
   alert("Укажи правильную дату следующей зарплаты.");
   return;
  }

  if(data.date>dateNow()){
   alert("Дата получения не может быть в будущем.");
   return;
  }

  if(db.periodStart&&
   !confirm(
    "Сохранить новое распределение и начать "+
    "новый финансовый период?"
   )){
   return;
  }

  startNewPeriod(data);
 }

 if(type==="expense"){
  const amount=cents(data.amount);

  if(!Number.isSafeInteger(amount)||amount<=0){
   alert("Проверь сумму.");
   return;
  }

  db.expenses.push({
   id:uid(),
   name:data.name.trim(),
   amount:rub(amount),
   date:dateNow()
  });
 }

 if(type==="bank"){
  const amount=cents(data.amount);
  const take=e.submitter?.value==="take";

  if(!Number.isSafeInteger(amount)||amount<=0){
   alert("Проверь сумму.");
   return;
  }

  if(take&&amount>cents(db.bank)){
   alert("Недостаточно денег.");
   return;
  }

  db.bank=rub(
   cents(db.bank)+(take?-amount:amount)
  );

  db.bankHistory.push({
   id:uid(),
   date:dateNow(),
   amount:rub(take?-amount:amount),
   note:take?"Снятие":"Пополнение",
   type:take?"MANUAL_WITHDRAW":"MANUAL_DEPOSIT"
  });
 }

 if(type==="trade"){
  const stake=round(data.stake);
  const payout=Number(data.payout);
  const result=e.submitter?.value==="loss"?
   "loss":"win";

  if(!Number.isFinite(stake)||stake<=0||
   !Number.isFinite(payout)||
   payout<0||payout>100){
   alert("Проверь параметры сделки.");
   return;
  }

  const todayTrades=db.trades
   .filter(x=>x.date===dateNow());

  let streak=0;

  for(let i=todayTrades.length-1;i>=0;i--){
   if(todayTrades[i].result==="loss")streak++;
   else break;
  }

  const current=db.capital+pnl();

  if(stake>current*.01){
   if(!confirm(
    "Ставка превышает риск 1%. "+
    "Записать нарушение?"
   ))return;
  }

  if(todayTrades.length>=5||streak>=2){
   if(!confirm(
    "Нарушение торгового лимита. "+
    "Записать сделку?"
   ))return;
  }

  const resultPnl=result==="win"?
   round(stake*payout/100):-stake;

  db.trades.push({
   id:uid(),
   date:dateNow(),
   asset:data.asset,
   tf:data.tf,
   direction:data.direction,
   stake,payout,result,
   pnl:resultPnl
  });
 }

 if(type==="report"){
  db.reports.unshift({
   ...data,
   id:uid(),
   date:data.date||dateNow(),
   source:db.raw
  });

  db.devTab="latest";
 }

 if(type==="idea"){
  db.ideas.push(data.text.trim());
 }

 if(type==="note"){
  db.notes.push({
   date:dateNow(),
   text:data.text.trim()
  });
 }

 render();
});

/* =====================================
   РЕЗЕРВНЫЕ КОПИИ
   ===================================== */

$("backupFile").addEventListener("change",async e=>{
 const file=e.target.files?.[0];
 if(!file)return;

 try{
  const obj=JSON.parse(await file.text());

  if(obj.app!=="ORACLE LIFE"||
   !obj.data||
   typeof obj.data!=="object"||
   Array.isArray(obj.data)){
   throw new Error("Неверный формат файла");
  }

  const restored={
   ...defaults(),
   ...obj.data
  };

  for(const name of arrays){
   if(!Array.isArray(restored[name])){
    throw new Error("Повреждён раздел "+name);
   }
  }

  if(confirm(
   "Заменить текущие данные резервной копией?"
  )){
   db=restored;

   if(!db.dayPlans||
    typeof db.dayPlans!=="object"){
    db.dayPlans={};
   }

   migrateFinance();
   closeFinanceDays();
   render();
  }
 }catch(error){
  alert("Ошибка импорта: "+error.message);
 }

 e.target.value="";
});

 );
